# Overlay for the hermetic fake cJSON port: the same shape the
# committed recipe had before cJSON migrated to a package, so the
# mock smoke test keeps exercising the recipe machinery (fetch,
# extract, overlay, build) against sources it fully controls.
[package]
name = "cJSON"
version = "1.7.18"

[target.cJSON]
type = "library"
sources = ["cJSON.c"]
include-dirs = ["."]
c-standard = "c11"
links = "cjson"
