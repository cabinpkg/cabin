# Overlay for the hermetic fake libpng port: the shape the committed
# recipe had before libpng migrated to a package, so the
# registry-ports test keeps exercising the recipe machinery - the
# `[[copy]]` step included - against sources it fully controls.  Its
# zlib edge names the scoped registry package, which is the only way
# one port can reach another now.
#
# The fake archive stubs every declared source except png.c, so the
# source list must stay the recipe's 15-source set for
# `stub_declared_sources_except` to generate the same tree.
[package]
name = "libpng"
version = "1.6.50"

[dependencies]
"cabin-ports/zlib" = "^1.3"

[target.libpng]
type = "library"
sources = [
  "png.c",
  "pngerror.c",
  "pngget.c",
  "pngmem.c",
  "pngpread.c",
  "pngread.c",
  "pngrio.c",
  "pngrtran.c",
  "pngrutil.c",
  "pngset.c",
  "pngtrans.c",
  "pngwio.c",
  "pngwrite.c",
  "pngwtran.c",
  "pngwutil.c",
]
include-dirs = ["."]
c-standard = "c11"
defines = ["PNG_ARM_NEON_OPT=0", "PNG_INTEL_SSE_OPT=0"]
deps = ["cabin-ports/zlib"]
links = "png"

[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]
