# Overlay for the hermetic fake xxhash port: the same shape the
# committed recipe had before xxhash migrated to a package, so the
# mock smoke test keeps exercising the recipe machinery (fetch,
# extract, overlay, build) against sources it fully controls.
[package]
name = "xxhash"
version = "0.8.3"

[target.xxhash]
type = "library"
sources = ["xxhash.c"]
include-dirs = ["."]
c-standard = "c11"
links = "xxhash"
