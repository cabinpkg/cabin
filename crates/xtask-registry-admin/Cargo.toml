[package]
name = "xtask-registry-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Repository tool: operator commands against the hosted registry"
# Repository-owned maintainer tooling (AGENTS.md, "Repository
# automation"): the commands act on this checkout's registry
# configuration and the operator's own credentials, so a published copy
# would have neither.
publish = false

[lib]
name = "xtask_registry_admin"

[[bin]]
name = "xtask-registry-admin"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
cabin-core = { workspace = true }
cabin-env = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
# The deploy gate's crate owns the `migrations/*.sql` glob rule; the
# diagnose bundle reads the stamp through the same function so the two
# cannot drift.
xtask-workflow-guard = { path = "../xtask-workflow-guard" }

[dev-dependencies]
assert_cmd = "2"
assert_fs = { workspace = true }
predicates = "3"
tiny_http = { workspace = true }
# Not a duplicate of the `ureq` above: the shipped binary trusts the
# compiled-in `webpki-roots` and nothing else, but the verify
# differential replays a shell that refuses a non-https origin, so both
# sides must reach a local TLS mock.  `curl` trusts a harness CA through
# `SSL_CERT_FILE`; `native-certs` is the only knob that lets `ureq` read
# the same variable.  Cargo unifies a dev-dependency's features into the
# binary only when dev targets are built, so `cargo build` and
# `cargo build --release` keep `webpki-roots` exactly as today.
ureq = { workspace = true, features = ["native-certs"] }

[lints]
workspace = true
