[package]
name = "xtask-registry-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Repository tool: operator commands against the hosted registry"
# Repository-owned maintainer tooling (AGENTS.md, "Repository
# automation"): the commands act on this checkout's registry
# configuration and the operator's own credentials, so a published copy
# would have neither.
publish = false

[dependencies]
anyhow = { workspace = true }
cabin-core = { workspace = true }
cabin-env = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
# The deploy gate's crate owns the `migrations/*.sql` glob rule; the
# diagnose bundle reads the stamp through the same function so the two
# cannot drift.
xtask-workflow-guard = { path = "../xtask-workflow-guard" }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_fs = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
