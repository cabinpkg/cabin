[package]
name = "xtask-port-publish"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Repository tool that publishes foundation ports as cabin-ports registry packages"
# Repository-owned maintainer tooling: the tool reads the committed
# `ports/` tree, so a published copy would have
# nothing to operate on.
publish = false

[dependencies]
anyhow = { workspace = true }
cabin-artifact = { workspace = true }
cabin-core = { workspace = true }
cabin-env = { workspace = true }
cabin-index-http = { workspace = true }
cabin-manifest = { workspace = true }
cabin-publish = { workspace = true }
camino = { workspace = true }
clap = { workspace = true }
etcetera = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
assert_fs = { workspace = true }
# Pins the rate-limit retry's stderr parser to the client's actual 429
# diagnostic rendering (see remote.rs tests).
cabin-registry-api = { workspace = true }
camino = { workspace = true }
flate2 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tiny_http = { workspace = true }

[lints]
workspace = true
