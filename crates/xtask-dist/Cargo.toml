[package]
name = "xtask-dist"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Repository tool: release packaging step for dist.yml"
# Repository-owned maintainer tooling (AGENTS.md, "Repository
# automation"): the step stages a release archive out of the build
# outputs of the run that invoked it, so a published copy would have
# nothing to package.
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
assert_fs = { workspace = true }

[lints]
workspace = true
