[package]
name = "cabinpkg-tidy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "clang-tidy runner for Cabin"

[lib]
name = "cabin_tidy"

[dependencies]
cabin-core = { workspace = true }
cabin-env = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
assert_fs = { workspace = true }

# Test-only stand-in for `run-clang-tidy`, so the tests need no LLVM
# install. Gated on the `test-fake-tidy` feature so builds without it,
# including end-user installs, skip the bin.
[features]
test-fake-tidy = []

[[bin]]
name = "cabin-tidy-fake-tidy"
path = "src/bin/fake_tidy.rs"
required-features = ["test-fake-tidy"]

[lints]
workspace = true
