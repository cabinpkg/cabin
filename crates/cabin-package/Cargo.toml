[package]
name = "cabinpkg-package"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Source-archive packaging and scaffolding for Cabin"

[lib]
name = "cabin_package"

[dependencies]
cabin-core = { workspace = true }
cabin-fs = { workspace = true }
cabin-manifest = { workspace = true }
camino = { workspace = true }
# Unused in code: selects flate2's backend, which zip's `deflate-flate2`
# leaves unset, so this crate builds on its own (e.g. `cargo publish`).
flate2 = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
assert_fs = { workspace = true }
predicates = "3"

[lints]
workspace = true
