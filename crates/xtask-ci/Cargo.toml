[package]
name = "xtask-ci"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Repository tool: the local mirror of the CI gate"
# Repository-owned maintainer tooling (AGENTS.md, "Repository
# automation"): it runs the workspace's own checks against this
# checkout, so a published copy would have nothing to check.
publish = false

[lib]
name = "xtask_ci"

[[bin]]
name = "xtask-ci"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
assert_fs = { workspace = true }
predicates = "3"

[lints]
workspace = true
