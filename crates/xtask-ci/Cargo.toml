[package]
name = "xtask-ci"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Repository tool: the local mirror of the CI gate"
# Repository-owned maintainer tooling (AGENTS.md, "Repository
# automation"): it runs the workspace's own checks against this
# checkout, so a published copy would have nothing to check.
publish = false

[dependencies]
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
assert_fs = { workspace = true }

[lints]
workspace = true
