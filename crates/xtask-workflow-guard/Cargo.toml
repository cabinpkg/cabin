[package]
name = "xtask-workflow-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Repository tool: guards over GitHub Actions runs and their change filters"
# Repository-owned maintainer tooling (AGENTS.md, "Repository
# automation"): the guards read the `GITHUB_*` context of the workflow
# run that spawned them, so a published copy would have no run to guard.
publish = false

[dependencies]
anyhow = { workspace = true }
cabin-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
assert_fs = { workspace = true }

[lints]
workspace = true
