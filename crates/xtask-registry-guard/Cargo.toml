[package]
name = "xtask-registry-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Repository tool: static guards over the registry Worker's sources and deploy configuration"
# Repository-owned maintainer tooling (AGENTS.md, "Repository
# automation"): the guards read the committed `registry/` tree, so a
# published copy would have nothing to inspect.
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_fs = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
