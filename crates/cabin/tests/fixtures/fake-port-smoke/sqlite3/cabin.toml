# Manifest for the hermetic fake sqlite3 port: the shape a committed
# port carries, so the registry-ports tests exercise the publish
# pipeline (fetch, extract, materialize, build) against sources they
# fully control.  `[package.upstream]` is stamped on at build time by
# `FakePortBuilder`, which owns the generated archive's checksum.  The feature and cfg-gated profile blocks are part
# of that shape: the fixtures assert the published target set, not
# just that something compiles.
[package]
name = "cabin-ports/sqlite3"
version = "3.53.2"

[features]
default = []
single-threaded = []

[target.sqlite3]
type = "library"
sources = ["sqlite3.c"]
include-dirs = ["."]
c-standard = "c11"
links = "sqlite3"

[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread", "dl", "m"]

[target.'cfg(feature = "single-threaded")'.profile]
defines = ["SQLITE_THREADSAFE=0"]
