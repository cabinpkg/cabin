# Overlay for the hermetic fake sqlite3 port: the same shape the
# committed recipe had before sqlite3 migrated to a package, so the
# mock smoke and registry-ports tests keep exercising the recipe
# machinery (fetch, extract, overlay, build) against sources they
# fully control.  The feature and cfg-gated profile blocks are part
# of that shape: the fixtures assert the published target set, not
# just that something compiles.
[package]
name = "sqlite3"
version = "3.53.2"

[features]
default = []
single-threaded = []

[target.sqlite3]
type = "library"
sources = ["sqlite3.c"]
include-dirs = ["."]
c-standard = "c11"
links = "sqlite3"

[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread", "dl", "m"]

[target.'cfg(feature = "single-threaded")'.profile]
defines = ["SQLITE_THREADSAFE=0"]
