# Manifest for the hermetic fake libpng port: the shape a committed
# port carries, so the registry-ports test exercises the publish
# pipeline - the copy step included - against sources it fully
# controls.  Its zlib edge names the scoped registry package, which is
# the only way one port reaches another.  `[package.upstream]` is
# stamped on at build time by `FakePortBuilder`, which owns the
# generated archive's checksum.
#
# The fake archive stubs every declared source except png.c, so the
# source list must stay this 15-source set for
# `stub_declared_sources_except` to generate the same tree.
[package]
name = "cabin-ports/libpng"
version = "1.6.50"

[dependencies]
"cabin-ports/zlib" = "^1.3"

[target.png]
type = "library"
sources = [
  "png.c",
  "pngerror.c",
  "pngget.c",
  "pngmem.c",
  "pngpread.c",
  "pngread.c",
  "pngrio.c",
  "pngrtran.c",
  "pngrutil.c",
  "pngset.c",
  "pngtrans.c",
  "pngwio.c",
  "pngwrite.c",
  "pngwtran.c",
  "pngwutil.c",
]
include-dirs = ["."]
c-standard = "c11"
defines = ["PNG_ARM_NEON_OPT=0", "PNG_INTEL_SSE_OPT=0"]
deps = ["cabin-ports/zlib"]
links = "png"

[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]
