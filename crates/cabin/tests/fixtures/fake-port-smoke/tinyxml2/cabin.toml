# Overlay for the hermetic fake tinyxml2 port: the same shape the
# committed recipe had before tinyxml2 migrated to a package, so the
# mock smoke and registry-ports tests keep exercising the recipe
# machinery (fetch, extract, overlay, build) against sources they
# fully control.
[package]
name = "tinyxml2"
version = "11.0.0"

[target.tinyxml2]
type = "library"
sources = ["tinyxml2.cpp"]
include-dirs = ["."]
cxx-standard = "c++17"
links = "tinyxml2"
