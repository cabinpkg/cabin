# Manifest for the hermetic fake tinyxml2 port: the shape a committed
# port carries, so the registry-ports tests exercise the publish
# pipeline (fetch, extract, materialize, build) against sources they
# fully control.  `[package.upstream]` is stamped on at build time by
# `FakePortBuilder`, which owns the generated archive's checksum.
[package]
name = "cabin-ports/tinyxml2"
version = "11.0.0"

[target.tinyxml2]
type = "library"
sources = ["tinyxml2.cpp"]
include-dirs = ["."]
cxx-standard = "c++17"
links = "tinyxml2"
