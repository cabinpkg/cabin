[package.upstream]
url = "https://github.com/boostorg/mqtt5/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:6c596a2a217b5752f70a25cce4fedce8baa42d108128c9e2aace10b34ed37d10"
format = "tar.gz"
strip-prefix = "mqtt5-boost-1.92.0"

[package]
name = "cabin-ports/boost-mqtt5"
version = "1.92.0"

[dependencies]
"cabin-ports/boost-asio" = "=1.92.0"
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-beast" = "=1.92.0"
"cabin-ports/boost-container" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-endian" = "=1.92.0"
"cabin-ports/boost-random" = "=1.92.0"
"cabin-ports/boost-range" = "=1.92.0"
"cabin-ports/boost-smart-ptr" = "=1.92.0"
"cabin-ports/boost-system" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"

# boost/mqtt5/ssl.hpp and boost/mqtt5/websocket_ssl.hpp include Asio's SSL
# headers, which need OpenSSL; it has no port, so they compile only for a
# consumer that supplies OpenSSL itself.
[target.boost_mqtt5]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
deps = [
  { name = "cabin-ports/boost-asio", public = true },
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-beast", public = true },
  { name = "cabin-ports/boost-container", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-endian", public = true },
  { name = "cabin-ports/boost-random", public = true },
  { name = "cabin-ports/boost-range", public = true },
  { name = "cabin-ports/boost-smart-ptr", public = true },
  { name = "cabin-ports/boost-system", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
]
