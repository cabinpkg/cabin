[package.upstream]
url = "https://github.com/boostorg/parser/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:11c5ce26d3c02cc32bbbea7a14226fee78a59faf28064eaa0d2e2bc7bfac7d1b"
format = "tar.gz"
strip-prefix = "parser-boost-1.92.0"

[package]
name = "cabin-ports/boost-parser"
version = "1.92.0"

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-charconv" = "=1.92.0"
"cabin-ports/boost-hana" = "=1.92.0"
"cabin-ports/boost-type-index" = "=1.92.0"

[target.boost_parser]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-charconv", public = true },
  { name = "cabin-ports/boost-hana", public = true },
  { name = "cabin-ports/boost-type-index", public = true },
]
