[package.upstream]
url = "https://github.com/boostorg/core/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:aa4eb2ccbe5577ded70f25b8f0d852a5246591f90cc34916160739e3d0dbfea6"
format = "tar.gz"
strip-prefix = "core-boost-1.92.0"

[package]
name = "cabin-ports/boost-core"
version = "1.92.0"

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-throw-exception" = "=1.92.0"

[target.boost_core]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++98"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-throw-exception", public = true },
]
