[package.upstream]
url = "https://github.com/boostorg/functional/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:fbe33f97a5efc443f519da27354c9ea45539074db2e4dfe0a50e2f9d7836914a"
format = "tar.gz"
strip-prefix = "functional-boost-1.92.0"

[package]
