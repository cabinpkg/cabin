[package.upstream]
url = "https://github.com/boostorg/stl_interfaces/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:c3b607dcf8d41abe55b9debdccde1a77e7d3827f2efb6f40507d0e1872280afb"
format = "tar.gz"
strip-prefix = "stl_interfaces-boost-1.92.0"

[package]
name = "cabin-ports/boost-stl-interfaces"
version = "1.92.0"

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"

[target.boost_stl_interfaces]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
]
