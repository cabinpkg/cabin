# Both sources define BOOST_GRAPH_SOURCE themselves.  src/graphml.cpp
# parses GraphML with Boost.PropertyTree's bundled XML parser, so no
# XML library is needed.
[target.boost_graph]
type = "library"
sources = ["src/graphml.cpp", "src/read_graphviz_new.cpp"]
include-dirs = ["include"]
cxx-standard = "c++14"
interface-cxx-standard = "c++14"
links = "boost_graph"
deps = [
