checksum = "sha256:60372a4eb59dba735bf008d949443dc245b647b4335c6db9586523755c9b4e03"
format = "tar.gz"
strip-prefix = "graph-boost-1.92.0"

[package]
name = "cabin-ports/boost-graph"
version = "1.92.0"

[dependencies]
