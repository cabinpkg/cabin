[package.upstream]
url = "https://github.com/boostorg/test/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:7c32dab7846f42ac514dde65974299f2ccd8d77d930c1ed34e225e3b60bb7675"
format = "tar.gz"
strip-prefix = "test-boost-1.92.0"

[package]
name = "cabin-ports/boost-test"
version = "1.92.0"

[dependencies]
"cabin-ports/boost-algorithm" = "=1.92.0"
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-bind" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-detail" = "=1.92.0"
"cabin-ports/boost-exception" = "=1.92.0"
"cabin-ports/boost-function" = "=1.92.0"
"cabin-ports/boost-io" = "=1.92.0"
"cabin-ports/boost-iterator" = "=1.92.0"
"cabin-ports/boost-mpl" = "=1.92.0"
"cabin-ports/boost-numeric-conversion" = "=1.92.0"
"cabin-ports/boost-optional" = "=1.92.0"
"cabin-ports/boost-preprocessor" = "=1.92.0"
"cabin-ports/boost-smart-ptr" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"
"cabin-ports/boost-utility" = "=1.92.0"

# The static Unit Test Framework.  src/unit_test_main.cpp supplies
# main(), so a consumer defines BOOST_TEST_MODULE and no main of its
# own.  prg_exec_monitor and test_exec_monitor are left out: they are
# alternative entry points (main() around the user's cpp_main or
# test_main) built from the same sources, so a consumer links exactly
# one of the three.
[target.boost_unit_test_framework]
type = "library"
sources = [
  "src/compiler_log_formatter.cpp",
  "src/debug.cpp",
  "src/decorator.cpp",
  "src/execution_monitor.cpp",
  "src/framework.cpp",
  "src/junit_log_formatter.cpp",
  "src/plain_report_formatter.cpp",
  "src/progress_monitor.cpp",
  "src/results_collector.cpp",
  "src/results_reporter.cpp",
  "src/test_framework_init_observer.cpp",
  "src/test_tools.cpp",
  "src/test_tree.cpp",
  "src/unit_test_log.cpp",
  "src/unit_test_main.cpp",
  "src/unit_test_monitor.cpp",
  "src/unit_test_parameters.cpp",
  "src/xml_log_formatter.cpp",
  "src/xml_report_formatter.cpp",
]
include-dirs = ["include"]
cxx-standard = "c++14"
interface-cxx-standard = "c++14"
links = "boost_unit_test_framework"
deps = [
  { name = "cabin-ports/boost-algorithm", public = true },
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-bind", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-detail", public = true },
  { name = "cabin-ports/boost-exception", public = true },
  { name = "cabin-ports/boost-function", public = true },
  { name = "cabin-ports/boost-io", public = true },
  { name = "cabin-ports/boost-iterator", public = true },
  { name = "cabin-ports/boost-mpl", public = true },
  { name = "cabin-ports/boost-numeric-conversion", public = true },
  { name = "cabin-ports/boost-optional", public = true },
  { name = "cabin-ports/boost-preprocessor", public = true },
  { name = "cabin-ports/boost-smart-ptr", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
  { name = "cabin-ports/boost-utility", public = true },
]
