[package.upstream]
url = "https://github.com/boostorg/multiprecision/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:9da997843edd802f9d5e25d53872a7676330f31a52a5e47a418d1c94ba3b01d0"
format = "tar.gz"
strip-prefix = "multiprecision-boost-1.92.0"

[package]
name = "cabin-ports/boost-multiprecision"
version = "1.92.0"

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-integer" = "=1.92.0"
"cabin-ports/boost-lexical-cast" = "=1.92.0"
"cabin-ports/boost-math" = "=1.92.0"
"cabin-ports/boost-predef" = "=1.92.0"
"cabin-ports/boost-random" = "=1.92.0"
"cabin-ports/boost-throw-exception" = "=1.92.0"

# The gmp, mpfr, mpfi, mpc and tommath backends, the Eigen interop header,
# and float128 and complex128 (libquadmath) need libraries with no port;
# the header-only cpp_* backends need none.
[target.boost_multiprecision]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-integer", public = true },
  { name = "cabin-ports/boost-lexical-cast", public = true },
  { name = "cabin-ports/boost-math", public = true },
  { name = "cabin-ports/boost-predef", public = true },
  { name = "cabin-ports/boost-random", public = true },
  { name = "cabin-ports/boost-throw-exception", public = true },
]
