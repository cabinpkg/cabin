[package.upstream]
url = "https://downloads.sourceforge.net/libpng/libpng-1.6.59.tar.gz"
checksum = "sha256:86a3e4b501f7f50e392c4e456ea158893e9a595b1c63eb88c7bb9f6cf8772dad"
format = "tar.gz"
strip-prefix = "libpng-1.6.59"

[[package.upstream.copy]]
from = "scripts/pnglibconf.h.prebuilt"
to = "pnglibconf.h"
[package]
name = "cabin-ports/libpng"
version = "1.6.59"

# libpng's encoder/decoder call into zlib for the DEFLATE stream, so
# libpng depends on the bundled zlib port. Only the internal
# pngstruct.h includes zlib.h (png.h and pngconf.h do not), so the edge
# is private: libpng's own sources find zlib.h, and consumers still
# link zlib transitively — no -lz needed below.
[dependencies]
"cabin-ports/zlib" = "^1.3"

[target.png]
type = "library"
# The 15 portable C sources of the reference library. The optional
# hand-written SIMD units (arm/, intel/, etc.) and the pngtest.c /
# CLI tools are intentionally excluded — see the SIMD note below.
sources = [
  "png.c",
  "pngerror.c",
  "pngget.c",
  "pngmem.c",
  "pngpread.c",
  "pngread.c",
  "pngrio.c",
  "pngrtran.c",
  "pngrutil.c",
  "pngset.c",
  "pngtrans.c",
  "pngwio.c",
  "pngwrite.c",
  "pngwtran.c",
  "pngwutil.c",
]
include-dirs = ["."]
# Cabin requires an explicit standard for every compiled language;
# c11 is what this port has always compiled as.
c-standard = "c11"
# The portable sources reference the SIMD init hooks
# (png_init_filter_functions_neon, _sse2, _vsx, _msa, _lsx) whenever the
# target compiler advertises the extension, but those hooks live in
# translation units not built above. Compiling the optimizations out keeps
# the 15-source set self-contained and linkable on every architecture; the
# C fallbacks are always present.
defines = [
  "PNG_ARM_NEON_OPT=0",
  "PNG_INTEL_SSE_OPT=0",
  "PNG_LOONGARCH_LSX_OPT=0",
  "PNG_MIPS_MSA_OPT=0",
  "PNG_POWERPC_VSX_OPT=0",
]
deps = ["cabin-ports/zlib"]
links = "png"

# libpng's gamma and transform math calls pow()/floor() from libm. On
# Unix that is a separate system library (required on glibc, a no-op on
# macOS where it lives in libSystem), so it is declared as a propagating
# link-lib that reaches every consumer's link line after the archives.
# Windows has no libm. (libpng.pc records the same `-lm` in Libs.private.)
[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]
