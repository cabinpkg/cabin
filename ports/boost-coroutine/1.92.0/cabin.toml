[package.upstream]
url = "https://github.com/boostorg/coroutine/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:bb9810f4783ac714588c611359a7d8e305a643a95e28ceb7a098ddfa30e1bb7e"
format = "tar.gz"
strip-prefix = "coroutine-boost-1.92.0"

[package]
name = "cabin-ports/boost-coroutine"
version = "1.92.0"

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-context" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-exception" = "=1.92.0"
"cabin-ports/boost-move" = "=1.92.0"
"cabin-ports/boost-system" = "=1.92.0"
"cabin-ports/boost-throw-exception" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"
"cabin-ports/boost-utility" = "=1.92.0"

# Switches stacks through Boost.Context's fcontext assembly.  The headers
# read BOOST_COROUTINES_SOURCE, not CMake's other spelling
# BOOST_COROUTINE_SOURCE.
[target.boost_coroutine]
type = "library"
sources = ["src/detail/coroutine_context.cpp", "src/exceptions.cpp"]
include-dirs = ["include"]
defines = ["BOOST_COROUTINES_SOURCE"]
cxx-standard = "c++14"
interface-cxx-standard = "c++14"
links = "boost_coroutine"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-context", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-exception", public = true },
  { name = "cabin-ports/boost-move", public = true },
  { name = "cabin-ports/boost-system", public = true },
  { name = "cabin-ports/boost-throw-exception", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
  { name = "cabin-ports/boost-utility", public = true },
]

[target.'cfg(family = "unix")'.sources]
boost_coroutine = ["src/posix/stack_traits.cpp"]

[target.'cfg(os = "windows")'.sources]
boost_coroutine = ["src/windows/stack_traits.cpp"]
