[package]
name = "cli-with-spdlog"
version = "0.1.0"
cxx-standard = "c++17"

[dependencies]
"cabin-ports/cli11" = "=2.6.2"
"cabin-ports/fmt" = "=12.2.0"
"cabin-ports/spdlog" = "=1.17.0"

[target.cli-with-spdlog]
type = "executable"
sources = ["src/main.cc"]
# spdlog is header-only and defaults to its bundled {fmt}
# copy. Defining SPDLOG_FMT_EXTERNAL in this consumer's own
# translation units switches every spdlog header to the external
# fmt package instead, so the app, spdlog, and fmt all share one {fmt}.
defines = ["SPDLOG_FMT_EXTERNAL"]
deps = ["cabin-ports/cli11", "cabin-ports/fmt", "cabin-ports/spdlog"]
