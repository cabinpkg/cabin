[package]
name = "unit-test-gtest"
version = "0.1.0"
cxx-standard = "c++17"

# Test-only: `cabin test` activates dev dependencies for the
# selected packages, so the `test` target can link GoogleTest while
# `cabin build` ignores it entirely.
[dev-dependencies]
"cabin-ports/googletest" = "=1.17.0"

[target.stats]
type = "library"
sources = ["src/stats.cc"]
include-dirs = ["include"]

[target.stats_gtest]
type = "test"
sources = ["tests/stats_gtest.cc"]
deps = ["stats", "cabin-ports/googletest"]
