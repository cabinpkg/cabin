[package]
name = "libpng-usage"
version = "0.1.0"
c-standard = "c11"

[dependencies]
# libpng depends on zlib. The app declares only
# libpng; zlib is pulled in transitively, and its archive + headers
# propagate through the libpng edge.
"cabin-ports/libpng" = "=1.6.50"

[target.libpng-usage]
type = "executable"
sources = ["src/main.c"]
deps = ["cabin-ports/libpng"]
