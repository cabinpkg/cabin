[package.upstream]
url = "https://github.com/richgel999/miniz/releases/download/3.1.2/miniz-3.1.2.zip"
checksum = "sha256:f0446d863f9c19926ad9483c523fdc42e42b8d4a6a431d27e09d49c79a140d9a"
format = "zip"
[package]
name = "cabin-ports/miniz"
version = "3.1.2"

# The amalgamation is a single translation unit: miniz.c plus the
# miniz.h header. The bundled examples/ directory is upstream's
# sample code, not part of the library, and is intentionally not
# built. The library compiles with a strict C compiler and needs no
# extra link libraries. Note the release version (3.1.2) and the
# MZ_VERSION string in miniz.h ("11.3.2", miniz's internal zlib-style
# version) intentionally differ upstream.
[target.miniz]
type = "library"
sources = ["miniz.c"]
include-dirs = ["."]
# Cabin requires an explicit standard for every compiled language;
# c11 is what this port has always compiled as.
c-standard = "c11"
# A strict -std=c11 makes glibc hide the POSIX ftello / fseeko that
# miniz's Linux file-I/O path calls, and GCC 14+ rejects the implicit
# declarations. _LARGEFILE64_SOURCE is the define miniz.h prescribes
# for glibc: it switches miniz to the fopen64 / ftello64 / fseeko64
# path, which glibc declares regardless of the standard, and it is
# inert on macOS, the BSDs and MSVC.
defines = ["_LARGEFILE64_SOURCE=1"]
# Not "z": miniz objects export only mz_* symbols (the zlib-style
# names are header-level wrappers for consumers), so it never
# collides with zlib at the final link.
links = "miniz"
