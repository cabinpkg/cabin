\* The NoSameBytesTwice trap (README.md, "Non-vacuity"): two versions
\* storing the same archive bytes.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1, v2}
    Checksums = {1}
    Users = {u1, u2}
    Uploads = {i1, i2}
    Publishers = {p1, p2}
    Verifiers = {w1, w2}
    Placers = {}
    MaxStamps = 2
    Malicious = {}
    Stray = {}
    PendingLimit = 1
    DailyLimit = 2
    StorageLimit = 2
SYMMETRY Symmetry
INVARIANTS
    NoSameBytesTwice
