[package]
name = "googletest-usage"
version = "0.1.0"
cxx-standard = "c++17"

# Test-only: `cabin test` activates dev dependencies for the
# selected packages, so the `test` target can link GoogleTest while
# `cabin build` ignores it entirely.
[dev-dependencies]
"cabin-ports/googletest" = "=1.17.0"

[target.calc]
type = "library"
sources = ["src/calc.cc"]
include-dirs = ["include"]

[target.calc_gtest]
type = "test"
sources = ["tests/calc_gtest.cc"]
deps = ["calc", "cabin-ports/googletest"]
