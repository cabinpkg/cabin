[package]
name = "platform-cfg"
version = "0.1.0"
c-standard = "c11"
cxx-standard = "c++17"

[target.platform-cfg]
type = "executable"
sources = ["src/main.cc"]

# Platform-conditional preprocessor defines. Each `cfg(...)` predicate
# is evaluated against the platform being built for (the build machine,
# or the `--target` triple), so every OS compiles with its own define,
# passed as `/D` to MSVC and `-D` to GCC/Clang.
[target.'cfg(os = "windows")'.profile]
defines = ["CABIN_ON_WINDOWS"]

[target.'cfg(family = "unix")'.profile]
defines = ["CABIN_ON_UNIX"]

# Platform-conditional sources: each host compiles exactly one of these
# two C files into the executable. Both define the same function, so
# compiling the other platform's file too would fail the link.
[target.'cfg(os = "windows")'.sources]
platform-cfg = ["src/platform_windows.c"]

[target.'cfg(family = "unix")'.sources]
platform-cfg = ["src/platform_unix.c"]
