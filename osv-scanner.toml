# Accepted advisories for `.github/workflows/osv-scanner.yml`, one file
# for every lockfile: one next to registry/ or website/ lockfiles would
# re-run, and redeploy, that tree on every renewal.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2027-04-30
reason = "registry/: Marvin is a timing attack on private-key operations; the Worker only verifies RS256 signatures with GitHub's public keys, and no fixed rsa release exists."

