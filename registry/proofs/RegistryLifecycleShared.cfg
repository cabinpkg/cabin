\* The CI configuration for the same bytes on two versions, published by
\* two accounts: each row is its own upload, charged and refunded on its
\* own, to its own publisher.  No archive placement runs, so no row goes
\* past verified.  README.md records the state counts.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1, v2}
    Checksums = {1}
    Users = {u1, u2}
    Uploads = {i1, i2}
    Publishers = {p1, p2}
    Verifiers = {w1}
    Placers = {}
    MaxStamps = 3
    Malicious = {}
    Stray = {}
    PendingLimit = 1
    DailyLimit = 2
    StorageLimit = 2
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    RowsStamped
    PublicReadsAreArchived
    ArchivedIsPlaced
    TerminalDecidedOnCurrentGeneration
    PendingUndecided
    VerifiedByInspection
    VerdictOnlyOnStored
    UploadIdNamesOneRow
    StoredHasObject
    StoredBytesExact
    WithinLimits
PROPERTIES
    ArchivedImmutable
    VerifiedUnlessSourceLost
    ArchivesWriteOnce
    RejectedOnlyRevives
    LiveGenerationStable
    ServedChangesOnlyByPlacement
    RespinNeedsOptIn
    ChargedOncePerOperation
    SpentIdStaysSpent
