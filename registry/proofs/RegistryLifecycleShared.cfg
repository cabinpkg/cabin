\* The CI configuration for a shared blob: two versions storing the same
\* archive bytes, so the sole-live-reference accounting and the reclaim
\* refcount matter.  README.md records the state counts.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1, v2}
    Checksums = {1}
    Publishers = {p1, p2}
    Verifiers = {w1, w2}
    MaxStamps = 3
    Malicious = {}
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    RowsStamped
    PublicReadsAreVerified
    TerminalDecidedOnCurrentGeneration
    PendingUndecided
    VerifiedByInspection
    CounterExact
    LedgerConservative
PROPERTIES
    VerifiedImmutable
    RejectedOnlyRevives
    LiveGenerationStable
    ServedChangesOnlyByVerification
    RespinNeedsOptIn
    AnsweredWithoutCommitWritesNothing
