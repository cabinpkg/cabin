\* The CI configuration for the archive scan's rejection: one version, two
\* archive contents of which the inspector rejects the second outright,
\* two concurrent publishers, two concurrent verifier runs, two concurrent
\* archive placements, two publish events per execution, storage for only
\* one of the two contents at a time, and an ARCHIVES key that may already
\* hold an object no placement wrote.  README.md records the state counts.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1}
    Checksums = {1, 2}
    Users = {u1}
    Uploads = {i1, i2}
    Publishers = {p1, p2}
    Verifiers = {w1, w2}
    Placers = {k1, k2}
    MaxStamps = 2
    Malicious = {2}
    Stray = {1}
    PendingLimit = 2
    DailyLimit = 2
    StorageLimit = 2
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    RowsStamped
    PublicReadsAreArchived
    ArchivedIsPlaced
    TerminalDecidedOnCurrentGeneration
    PendingUndecided
    VerifiedByInspection
    VerdictOnlyOnStored
    UploadIdNamesOneRow
    StoredHasObject
    StoredBytesExact
    WithinLimits
PROPERTIES
    ArchivedImmutable
    VerifiedUnlessSourceLost
    ArchivesWriteOnce
    RejectedOnlyRevives
    LiveGenerationStable
    ServedChangesOnlyByPlacement
    RespinNeedsOptIn
    ChargedOncePerOperation
    SpentIdStaysSpent
