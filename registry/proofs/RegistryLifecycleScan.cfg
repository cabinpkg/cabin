\* The CI configuration for the archive scan's rejection: one version, two
\* archive contents of which the inspector rejects the second outright,
\* two concurrent publishers, two concurrent verifier runs, two publish
\* events per execution.  README.md records the state counts.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1}
    Checksums = {1, 2}
    Publishers = {p1, p2}
    Verifiers = {w1, w2}
    MaxStamps = 2
    Malicious = {2}
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    RowsStamped
    PublicReadsAreVerified
    TerminalDecidedOnCurrentGeneration
    PendingUndecided
    VerifiedByInspection
    CounterExact
    LedgerConservative
PROPERTIES
    VerifiedImmutable
    RejectedOnlyRevives
    LiveGenerationStable
    ServedChangesOnlyByVerification
    RespinNeedsOptIn
    AnsweredWithoutCommitWritesNothing
