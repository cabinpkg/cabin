\* The CI configuration for the archive scan's rejection: one version, two
\* archive contents of which the inspector rejects the second outright,
\* two concurrent publishers, two concurrent verifier runs, two publish
\* events per execution, and storage for only one of the two contents
\* at a time.  README.md records the state counts.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1}
    Checksums = {1, 2}
    Users = {u1}
    Uploads = {i1, i2}
    Publishers = {p1, p2}
    Verifiers = {w1, w2}
    MaxStamps = 2
    Malicious = {2}
    PendingLimit = 2
    DailyLimit = 2
    StorageLimit = 2
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    RowsStamped
    PublicReadsAreVerified
    TerminalDecidedOnCurrentGeneration
    PendingUndecided
    VerifiedByInspection
    VerdictOnlyOnStored
    UploadIdNamesOneRow
    StoredHasObject
    StoredBytesExact
    WithinLimits
PROPERTIES
    VerifiedImmutable
    RejectedOnlyRevives
    LiveGenerationStable
    ServedChangesOnlyByVerification
    RespinNeedsOptIn
    ChargedOncePerOperation
    SpentIdStaysSpent
