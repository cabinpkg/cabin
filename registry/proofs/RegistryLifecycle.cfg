\* The CI configuration for respins and revivals: one version, two archive
\* contents, two concurrent publishers, two concurrent verdict requests,
\* three publish events per execution.  README.md records the state counts.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1}
    Checksums = {1, 2}
    Publishers = {p1, p2}
    Verifiers = {w1, w2}
    MaxStamps = 3
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    RowsStamped
    PublicReadsAreVerified
    TerminalDecidedOnCurrentGeneration
    PendingUndecided
    CounterExact
    LedgerConservative
PROPERTIES
    VerifiedImmutable
    RejectedOnlyRevives
    LiveGenerationStable
    ServedChangesOnlyByVerification
    RespinNeedsOptIn
    AnsweredWithoutCommitWritesNothing
