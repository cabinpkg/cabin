\* The CI configuration for respins and revivals: one version, two archive
\* contents the inspector may verify, two concurrent publishers, one
\* verifier run at a time (the concurrent-verifier races are the other two
\* configurations' business; a second run here is too many states for CI),
\* three publish events per execution.  README.md records the state counts.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1}
    Checksums = {1, 2}
    Publishers = {p1, p2}
    Verifiers = {w1}
    MaxStamps = 3
    Malicious = {}
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    RowsStamped
    PublicReadsAreVerified
    TerminalDecidedOnCurrentGeneration
    PendingUndecided
    VerifiedByInspection
    CounterExact
    LedgerConservative
PROPERTIES
    VerifiedImmutable
    RejectedOnlyRevives
    LiveGenerationStable
    ServedChangesOnlyByVerification
    RespinNeedsOptIn
    AnsweredWithoutCommitWritesNothing
