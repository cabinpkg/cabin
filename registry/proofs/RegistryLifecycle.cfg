\* The CI configuration for respins and returning operations: one version,
\* two archive contents the inspector may verify, two concurrent
\* publishers, one verifier run at a time, three publish events per
\* execution.  One pending upload at a time and two operations a day, so
\* both limits bind.  README.md records the state counts.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1}
    Checksums = {1, 2}
    Users = {u1}
    Uploads = {i1, i2}
    Publishers = {p1, p2}
    Verifiers = {w1}
    MaxStamps = 3
    Malicious = {}
    PendingLimit = 1
    DailyLimit = 2
    StorageLimit = 3
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    RowsStamped
    PublicReadsAreVerified
    TerminalDecidedOnCurrentGeneration
    PendingUndecided
    VerifiedByInspection
    VerdictOnlyOnStored
    UploadIdNamesOneRow
    StoredHasObject
    StoredBytesExact
    WithinLimits
PROPERTIES
    VerifiedImmutable
    RejectedOnlyRevives
    LiveGenerationStable
    ServedChangesOnlyByVerification
    RespinNeedsOptIn
    ChargedOncePerOperation
    SpentIdStaysSpent
