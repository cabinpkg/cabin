\* Non-vacuity (README.md, "Non-vacuity"): every trap below is the negation
\* of a behavior the model must reach, so TLC must report it violated and
\* print the witness trace.  TLC stops at the first violation it finds, so
\* `cargo check-tlc-witnesses` runs each trap alone.  NoSameBytesTwice
\* needs two versions: RegistryLifecycleShared_witness.cfg.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1}
    Checksums = {1, 2}
    Users = {u1}
    Uploads = {i1, i2}
    Publishers = {p1, p2}
    Verifiers = {w1, w2}
    MaxStamps = 2
    Malicious = {2}
    PendingLimit = 2
    DailyLimit = 2
    StorageLimit = 3
SYMMETRY Symmetry
INVARIANTS
    NoVerified
    NoRevivedVerified
    NoRespin
    NoInspectedRejection
    NoManualRejection
    NoRelease
    NoResume
    NoTimeout
    NoStaleObject
    NoVerifiedObjectReplaced
PROPERTIES
    NoStaleVerdictRefused
    NoLostConfirm
    NoConvergence
    NoCronConfirm
    NoLateObject
