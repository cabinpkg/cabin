\* Non-vacuity (README.md, "Non-vacuity"): every trap below is the negation
\* of a behavior the model must reach, so TLC must report it violated and
\* print the witness trace.  TLC stops at the first violation it finds; to
\* see a particular witness, keep only that trap.  NoSharedBlob needs two
\* versions, one checksum, and Malicious = {}: swap the constants in for it.
SPECIFICATION Spec
CONSTANTS
    Versions = {v1}
    Checksums = {1, 2}
    Publishers = {p1, p2}
    Verifiers = {w1, w2}
    MaxStamps = 2
    Malicious = {2}
SYMMETRY Symmetry
INVARIANTS
    NoVerified
    NoRevivedVerified
    NoLostRace
    NoRespin
    NoRejection
    NoInspectedRejection
    NoManualRejection
    LiveBlobPresent
    NoSharedBlob
PROPERTIES
    NoStaleVerdictRefused
    NoVerdictLostRace
