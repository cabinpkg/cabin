# Shared per-component change filters. Two consumers: the shared
# `changes` gate (.github/workflows/changes.yml, dorny/paths-filter)
# that each workflow calls to gate its work jobs on these lists -
# jobs, not `paths:` triggers, and the required contexts are
# always() aggregates that fail closed on a failed gate - and
# `cargo workflow-superseded --relevant-to <filter>`,
# which scopes the deploy and publish freshness guards. Keep entries
# double-quoted on comment-free lines (the guard's strict parser
# otherwise warns and falls back to unscoped supersession), and keep
# the lists coarse. Each workflow's gate list ends with the CI files
# it consumes - its own workflow file, the shared gate workflow, any
# local action, and this filter file - so an edit to any of them
# re-runs exactly the workflows it affects and nothing else.

# rust.yml: the workspace and everything its tests stage (examples/
# run under the CLI tests, ports/ feed the publisher tests). Carries
# the .github entries for rust.yml's three lists: every rust.yml job
# condition includes `rust`.
rust:
  - "crates/**"
  - "examples/**"
  - "ports/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - ".github/workflows/rust.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"

# rust.yml's format job also checks every TOML file in the tree.
toml:
  - "**/*.toml"

# website.yml: the site renders docs/ and the ports tree's pages.
website:
  - "website/**"
  - "docs/**"
  - "ports/**"
  - ".github/workflows/website.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"

# registry.yml: the registry workspace, its crates/ path-deps, and
# the xtask guards built from the root workspace.
# SAFETY: keep this a superset of `ports` minus `ports/**` and
# ports-publish's own workflow file - ports-publish's deploy wait
# treats a job-skipped Registry run as already-deployed
# (crates/xtask-workflow-guard/src/await_deploy.rs), which stays
# sound only for entries that cannot change the Worker's accepted
# schema or the publish client; those two change neither.
registry:
  - "registry/**"
  - "crates/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - ".github/workflows/registry.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"

# ports-publish.yml: ports/ are what it publishes; the publisher and
# the cabin client build from the root workspace.
ports:
  - "ports/**"
  - "crates/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - ".github/workflows/ports-publish.yml"
  - ".github/workflows/changes.yml"
  - ".github/path-filters.yml"

# docker.yml proves the packaging only; a docker-only breakage
# surfaces on the next Dockerfile-touching change (accepted).
docker:
  - "Dockerfile"
  - "rust-toolchain.toml"
  - ".dockerignore"
  - ".github/workflows/docker.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"

# dist.yml on push/PR proves the packaging tooling; tags always build
# every target through release.yml, so the workspace stays out.
dist:
  - "crates/xtask-dist/**"
  - "crates/cabin/Cargo.toml"
  - "rust-toolchain.toml"
  - "demo.tape"
  - ".github/workflows/dist.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"
