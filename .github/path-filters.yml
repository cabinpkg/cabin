# Shared per-component change filters. Two consumers: the shared
# `changes` gate (.github/workflows/changes.yml, dorny/paths-filter),
# which each workflow calls to gate its work jobs on these lists, and
# `cargo workflow-superseded --relevant-to <filter>`, which scopes the
# deploy and publish freshness guards. Keep entries double-quoted on
# comment-free lines (in the lists the guards read, the strict parser
# otherwise fails the steps they gate), and keep the lists coarse,
# except the crate-scoped ones. The lists
# `cargo workflow-filter-coverage` checks, `rust` among them, take
# literal entries only; `!` entries exclude (the gate's
# `some-with-excludes`). Each workflow's gate list ends with the CI
# files it consumes - its own workflow file, the shared gate workflow,
# any local action, and this filter file - so an edit to any of them
# re-runs exactly the workflows it affects.

# rust.yml: the workspace and everything its tests stage (examples/
# run under the CLI tests, ports/ feed the publisher tests). Carries
# the .github entries for rust.yml's three lists: every rust.yml job
# condition includes `rust`.
rust:
  - "crates/**"
  - "examples/**"
  - "ports/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - ".github/workflows/rust.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"

# rust.yml's format job also checks every TOML file in the tree.
toml:
  - "**/*.toml"

# rust.yml's fuzz job runs on `rust` (the crates it fuzzes and the
# xtask that drives it) and on the fuzz workspace itself.
fuzz:
  - "fuzz/**"

# website.yml: the site renders docs/ and the ports tree's pages.
website:
  - "website/**"
  - "docs/**"
  - "ports/**"
  - ".github/workflows/website.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"

# registry.yml's conformance and deploy jobs and the deploy's
# freshness check: the registry workspace, its crates/ path-deps,
# and the xtask guards built from the root workspace.
# SAFETY: keep this a superset of `ports` minus `ports/**` and
# ports-publish's own workflow file - ports-publish's deploy wait
# treats a job-skipped Registry run as already-deployed
# (crates/xtask-workflow-guard/src/await_deploy.rs), which stays
# sound only for entries that cannot change the Worker's accepted
# schema or the publish client; those two change neither.
registry:
  - "registry/**"
  - "crates/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - ".github/workflows/registry.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"

# registry.yml's build and Kani jobs: the registry workspace and every
# crate but those outside what those jobs build, which
# `cargo workflow-filter-coverage` checks.
registry-build:
  - "registry/**"
  - "crates/**"
  - "!crates/cabin/**"
  - "!crates/cabin-build/**"
  - "!crates/cabin-config/**"
  - "!crates/cabin-credentials/**"
  - "!crates/cabin-diagnostics/**"
  - "!crates/cabin-driver/**"
  - "!crates/cabin-explain/**"
  - "!crates/cabin-feature/**"
  - "!crates/cabin-fmt/**"
  - "!crates/cabin-index/**"
  - "!crates/cabin-index-http/**"
  - "!crates/cabin-lockfile/**"
  - "!crates/cabin-ninja/**"
  - "!crates/cabin-publish/**"
  - "!crates/cabin-registry-api/**"
  - "!crates/cabin-registry-file/**"
  - "!crates/cabin-resolver/**"
  - "!crates/cabin-source-discovery/**"
  - "!crates/cabin-system-deps/**"
  - "!crates/cabin-test/**"
  - "!crates/cabin-tidy/**"
  - "!crates/cabin-toolchain/**"
  - "!crates/cabin-vendor/**"
  - "!crates/cabin-workspace/**"
  - "!crates/xtask-bench/**"
  - "!crates/xtask-dist/**"
  - "!crates/xtask-fuzz/**"
  - "!crates/xtask-port-publish/**"
  - "!crates/xtask-registry-fixtures/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - ".github/workflows/registry.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"

# registry.yml's tlc job: the TLA+ model and the xtask that checks its
# witness traps. The model abstracts the Worker rather than compiling
# it, so Worker and client changes cannot change TLC's verdict; a
# runner-side TLC break surfaces on the next model change (accepted).
tlc:
  - "registry/proofs/**"
  - "crates/xtask-registry-guard/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - ".github/workflows/registry.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"

# ports-publish.yml's publish freshness check: ports/ are what it
# publishes; the publisher and the cabin client build from the root
# workspace.
ports:
  - "ports/**"
  - "crates/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - ".github/workflows/ports-publish.yml"
  - ".github/workflows/changes.yml"
  - ".github/path-filters.yml"

# ports-publish.yml's pull-request dry-run: the ports and every crate
# but those outside what it builds, which `cargo workflow-filter-coverage`
# checks. .gitattributes decides the bytes the Windows leg checks out.
ports-dry-run:
  - "ports/**"
  - "crates/**"
  - "!crates/cabin-registry-verify/**"
  - "!crates/xtask-bench/**"
  - "!crates/xtask-ci/**"
  - "!crates/xtask-dist/**"
  - "!crates/xtask-fuzz/**"
  - "!crates/xtask-registry-admin/**"
  - "!crates/xtask-registry-fixtures/**"
  - "!crates/xtask-registry-guard/**"
  - "!crates/xtask-registry-smoke/**"
  - "!crates/xtask-workflow-guard/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - ".gitattributes"
  - ".github/workflows/ports-publish.yml"
  - ".github/workflows/changes.yml"
  - ".github/path-filters.yml"

# docker.yml proves the packaging only; a docker-only breakage
# surfaces on the next Dockerfile-touching change (accepted).
docker:
  - "Dockerfile"
  - "rust-toolchain.toml"
  - ".dockerignore"
  - ".github/workflows/docker.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"

# dist.yml on pull requests proves the packaging tooling; tags always
# build every target through release.yml, so the workspace stays out.
dist:
  - "crates/xtask-dist/**"
  - "crates/cabin/Cargo.toml"
  - "rust-toolchain.toml"
  - "demo.tape"
  - ".github/dist-demo/**"
  - ".github/workflows/dist.yml"
  - ".github/workflows/changes.yml"
  - ".github/actions/required-gate/**"
  - ".github/path-filters.yml"
