name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Reports the required contexts without analyzing: main fast-forwards
  # to the merge group's SHA, and the push run analyzes it there. An
  # analysis failure only the full run hits surfaces on main (accepted).
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '45 2 * * 3'

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: pushes, merge groups, and schedules are
# never cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: rust
          build-mode: none
    steps:
    - name: Checkout repository
      if: github.event_name != 'merge_group'
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      with:
        cache: false
        rustflags: ""
      if: matrix.language == 'rust' && github.event_name != 'merge_group'

    - name: Initialize CodeQL
      if: github.event_name != 'merge_group'
      uses: github/codeql-action/init@v4.39.0
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      if: github.event_name != 'merge_group'
      uses: github/codeql-action/analyze@v4.39.0
      with:
        category: "/language:${{matrix.language}}"
