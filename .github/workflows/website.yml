name: Website

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: pushes, merge groups, dispatches, calls,
# and schedules are never cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which shared path filters (.github/path-filters.yml) match this
  # push, pull request, or merge group; the work jobs below skip
  # when theirs does not. Every gated required context is an
  # always() aggregate below that fails closed on a failed gate.
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      website: ${{ steps.filter.outputs.website }}
    steps:
      # The filter file is read from the checkout, and push events
      # diff against the previous head from local history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  # Branch protection pins `build` below, never this job.
  build-work:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.node-version
          cache: npm
          # Resolved from the repository root: the job's
          # working-directory default does not apply to action inputs.
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Branch protection pins this, not `build-work`: `always()`, never
  # `!cancelled()`, fails it closed on a failed or cancelled gate.
  build:
    needs: [changes, build-work]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Fail unless build-work succeeded or the filter skipped it
        env:
          RESULT: ${{ needs.build-work.result }}
          GATE: ${{ needs.changes.result }}
          WEBSITE: ${{ needs.changes.outputs.website }}
        run: |
          if [ "$RESULT" = "success" ]; then exit 0; fi
          [ "$RESULT" = "skipped" ] && [ "$GATE" = "success" ] \
            && [ "$WEBSITE" = "false" ]
