name: Rust

on:
  pull_request:
  merge_group:
    types: [checks_requested]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: merge groups are never cancelled or
# queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which shared path filters (.github/path-filters.yml) match this
  # pull request or merge group; the work jobs below skip when theirs
  # does not. Every gated required context is an always() aggregate
  # below that fails closed on a failed gate.
  changes:
    # The gate's token comes from this job: a called workflow can
    # never exceed the calling job's permissions.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  # Format, clippy, and docs share one runner: each alone is
  # dominated by setup. The clippy and docs steps keep the old
  # per-job gate and skip on toml-only changes. Branch protection
  # pins `lint` below, never this job.
  lint-work:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.toml == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - parallel:
        - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
          with:
            cache: ${{ needs.changes.outputs.rust == 'true' }}
            cache-on-failure: false
            rustflags: ""

        - uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2
          with:
            version: "0.10.0"

      - parallel:
        - name: Check Rust formatting
          run: cargo fmt --all --verbose -- --check

        - name: Check TOML formatting
          run: taplo fmt --check

      - name: Clippy
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo clippy --workspace --all-targets --all-features --locked \
            --verbose -- -D warnings

      - name: Docs
        if: needs.changes.outputs.rust == 'true'
        run: cargo doc --workspace --all-features --no-deps --locked --verbose
        env:
          RUSTDOCFLAGS: -D warnings

  # Branch protection pins this, not `lint-work`: `always()`, never
  # `!cancelled()`, fails it closed on a failed or cancelled gate.
  lint:
    needs: [changes, lint-work]
    if: always()
    runs-on: ubuntu-slim
    steps:
      # The gate logic is a local action; the sparse checkout keeps
      # this fetch small.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/required-gate
      - name: Fail unless lint-work succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.lint-work.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.rust }},${{ needs.changes.outputs.toml }}

  # Branch protection requires `build-and-test-required` below,
  # never a matrix leg.
  build-and-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - windows-2025-vs2026
          - windows-11-vs2026-arm

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache-on-failure: false
          rustflags: ""

      # Every build tool ships preinstalled on the matrix images;
      # macOS's llvm@20 is keg-only and just needs the path.
      - name: Put the preinstalled LLVM tools on the path
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Build
        run: cargo check --workspace --all-targets --locked --verbose

      # x64's default %TEMP% sits on C:, slower than RUNNER_TEMP's D:. ARM
      # keeps its RUNNER~1 default: tests must still meet 8.3 short names.
      - name: Move the x64 Windows temp dir to the runner temp drive
        if: matrix.os == 'windows-2025-vs2026'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Run Tests
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast --verbose -- --show-output
        env:
          RUST_BACKTRACE: "1"

  # The fuzz workspace on its own pinned nightly (fuzz/README.md).
  # `build-and-test-required` gates on it too.
  fuzz:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache-on-failure: false
          cache-workspaces: |
            .
            fuzz
          rustflags: ""

      - name: Install the fuzz workspace's nightly
        run: rustup toolchain install
        working-directory: fuzz

      - name: Install cargo-fuzz
        run: cargo install -q "cargo-fuzz@=0.13.2" --locked

      - name: Check the fuzz targets
        run: cargo fuzz-check

  # Branch protection pins this aggregate: a skipped matrix job never
  # posts per-leg names. `always()`, never `!cancelled()`: a cancelled
  # run must fail this check, not skip it to a green required check.
  # Fails closed when the gate itself failed.
  build-and-test-required:
    needs: [changes, build-and-test, fuzz]
    if: always()
    runs-on: ubuntu-slim
    steps:
      # The gate logic is a local action; the sparse checkout keeps
      # this fetch small.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/required-gate
      - name: Fail unless the matrix succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.build-and-test.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.rust }}
      - name: Fail unless the fuzz check succeeded or the filters skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.fuzz.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.rust }},${{ needs.changes.outputs.fuzz }}

  # Verify Cabin auto-discovers the MSVC toolchain itself, with no
  # Developer Command Prompt / vcvarsall activation. This job deliberately
  # omits `ilammy/msvc-dev-cmd` so `cl.exe` / `lib.exe` and `INCLUDE` /
  # `LIB` are NOT on the environment; a green run proves the
  # `find-msvc-tools` discovery path works end to end. Kept separate from
  # `build-and-test` so the proven, pre-activated path can never be
  # reddened by this one.
  windows-msvc-autodiscovery:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache-on-failure: false
          rustflags: ""

      - name: Build cabin and run examples without a pre-activated MSVC env
        run: |
          # Guard against a false green: if the runner image ever ships
          # `INCLUDE` / `LIB` pre-set, Cabin's `already_activated()` check
          # short-circuits and the `find-msvc-tools` discovery path is
          # never exercised. Fail loudly so this job keeps proving what it
          # claims to.
          if ($env:INCLUDE -or $env:LIB) {
            Write-Error "INCLUDE/LIB are set; MSVC is pre-activated, so this job would not test auto-discovery."
            exit 1
          }
          cargo build --locked --bin cabin
          $cabin = "$env:GITHUB_WORKSPACE\target\debug\cabin.exe"
          foreach ($example in "hello-cpp", "hello-c") {
            Write-Host "::group::cabin run $example"
            Push-Location "examples\$example"
            & $cabin run
            $code = $LASTEXITCODE
            Pop-Location
            Write-Host "::endgroup::"
            if ($code -ne 0) { exit $code }
          }

  # Reality-check `--version` detection and compiler cfg conditions
  # against real versioned compilers. The canned-banner unit corpus is
  # the primary parser coverage; these passes prove end to end that a
  # pinned gcc-N / clang-N is detected with the right family + major
  # version and that compiler-gated profile flags flip accordingly.
  # macOS (AppleClang) and Windows (MSVC) stay covered by
  # `build-and-test`. One pass per family on one runner - one
  # checkout, cache restore, and toolchain setup instead of two; the
  # clang pass still rebuilds the CC-sensitive tail of the dependency
  # graph (ring's build script tracks CC/CXX). A failed gcc pass
  # skips the clang passes (accepted).
  compiler-detection:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # ubuntu-24.04 preinstalls both pinned compilers; bump the pins
    # and the image together.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache-on-failure: false
          rustflags: ""

      # Under the gcc env already: ring's build script tracks CC/CXX,
      # so an env-less build here would be rebuilt by the gcc pass.
      - name: Build the test binary and cabin
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cargo test -p cabinpkg --test cli --locked --no-run
          cargo build --locked --bin cabin

      - name: Run compiler detection and condition tests (gcc)
        env:
          CC: gcc-14
          CXX: g++-14
          RUST_BACKTRACE: "1"
        run: |
          # Warm the preinstalled compilers right before the tests:
          # the first-ever exec of a cold compiler demand-pages a
          # huge binary from disk, and with several test threads probing
          # `$CXX --version` at once that can exceed cabin's 10s
          # detection deadline, flaking the pass with `detected: null`.
          "$CC" --version
          "$CXX" --version
          cargo test -p cabinpkg --test cli --locked --verbose -- --show-output compiler_conditions compiler_detection

      - name: Assert detected identity matches pinned gcc
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          mkdir probe-gcc && cd probe-gcc
          ../target/debug/cabin init --bin
          ../target/debug/cabin metadata > metadata.json
          jq -e '.toolchain.detected.cxx.identity.kind == "gcc"' metadata.json
          jq -e '.toolchain.detected.cxx.identity.version | startswith("14.")' metadata.json

      - name: Run compiler detection and condition tests (clang)
        env:
          CC: clang-18
          CXX: clang++-18
          RUST_BACKTRACE: "1"
        run: |
          # Rebuild the CC-sensitive graph BEFORE the warmups so the
          # warm pages are not minutes old when the tests probe.
          cargo test -p cabinpkg --test cli --locked --no-run
          "$CC" --version
          "$CXX" --version
          cargo test -p cabinpkg --test cli --locked --verbose -- --show-output compiler_conditions compiler_detection

      - name: Assert detected identity matches pinned clang
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          mkdir probe-clang && cd probe-clang
          ../target/debug/cabin init --bin
          ../target/debug/cabin metadata > metadata.json
          jq -e '.toolchain.detected.cxx.identity.kind == "clang"' metadata.json
          jq -e '.toolchain.detected.cxx.identity.version | startswith("18.")' metadata.json
