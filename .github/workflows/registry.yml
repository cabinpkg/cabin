name: Registry

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: pushes and merge groups are never
# cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # One pin for the build the queue validates and the one Deploy ships.
  WORKER_BUILD: worker-build@0.8.5

jobs:
  # Which shared path filters (.github/path-filters.yml) match this
  # push, pull request, or merge group; the work jobs below skip
  # when theirs does not. Every gated required context is an
  # always() aggregate below that fails closed on a failed gate.
  changes:
    # The gate's token comes from this job: a called workflow can
    # never exceed the calling job's permissions.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  # Format, clippy, and the build share one runner: alone, each of
  # the cheap checks is dominated by checkout and toolchain setup.
  # Cheapest first, so a formatting slip fails in seconds. Branch
  # protection pins `registry-build` below, never this job. Merge
  # Queue validates pre-merge; a main push only deploys.
  registry-build-work:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.registry-build == 'true'
    # The image its cache key names.
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: registry

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Restore-only: registry-cache.yml seeds this key on main, the
      # one scope both pull requests and the merge queue can restore.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          target: wasm32-unknown-unknown
          cache-on-failure: false
          cache-shared-key: registry-build-work-ubuntu-26.04
          cache-bin: false
          cache-save-if: false
          # The root workspace too: the guard steps below build an
          # xtask crate from it.
          cache-workspaces: |
            .
            registry
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --all --verbose -- --check

      - name: Clippy (host)
        run: cargo clippy --all-targets --locked --verbose -- -D warnings

      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --locked --verbose -- -D warnings

      # Run from the repository root: the cargo aliases name
      # root-workspace packages (AGENTS.md, "Repository automation").
      - name: SQL consolidation guard
        run: cargo check-sql
        working-directory: .

      - name: R2 acquisition guard
        run: cargo check-r2
        working-directory: .

      - name: Run host-target tests
        run: cargo test --locked --verbose -- --show-output
        env:
          RUSTFLAGS: -D warnings

      # Stays on PATH for the smoke's `wrangler dev`, which runs
      # wrangler.jsonc's build.command again.
      - name: Install worker-build
        uses: taiki-e/cache-cargo-install-action@v3.0.8
        with:
          tool: ${{ env.WORKER_BUILD }}

      - name: Worker build
        run: worker-build --release

      # After the build so the bundle export check runs against the
      # artifact wrangler would actually deploy.
      - name: Deploy-config guard
        run: cargo check-deploy --require-bundle
        working-directory: .

      - name: Install wrangler
        run: npm ci --ignore-scripts

      # The one check that executes the glue: the publish, verify,
      # session, and governor paths against a local wrangler dev.
      - name: Local smoke
        run: cargo registry-smoke
        working-directory: .
        env:
          CABIN_REGISTRY_SMOKE_TOKEN: cabin_smoke

  # The deploy job's migrations gate, run before the merge over the
  # candidate's whole tree. Ungated: a main whose stamp no longer
  # matches blocks every merge, not only registry ones, until the
  # stamp is repaired (registry/docs/runbook.md, "Deploy skew").
  merge-readiness:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # No caches, like conformance below.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
          rustflags: ""

      - name: Require the D1 migrations to match their applied stamp
        run: cargo workflow-migrations-pending

  # Branch protection pins this, not the work jobs: `always()`, never
  # `!cancelled()`, fails it closed on a failed or cancelled gate.
  # Every validation job feeds it: a conformance or proof failure must
  # block the merge, and with it the deploy the merged push performs.
  registry-build:
    needs: [changes, merge-readiness, registry-build-work, conformance, kani, tlc-respins, tlc-shared, tlc-scan]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-slim
    steps:
      # Ungated, so a skip is never a pass.
      - name: Fail unless merge-readiness succeeded
        env:
          RESULT: ${{ needs.merge-readiness.result }}
        run: test "$RESULT" = success
      # The gate logic is a local action; the sparse checkout keeps
      # this fetch small.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/required-gate
      - name: Fail unless registry-build-work succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.registry-build-work.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.registry-build }}
      - name: Fail unless conformance succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.conformance.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.registry }}
      - name: Fail unless kani succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.kani.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.registry-build }}
      - name: Fail unless tlc-respins succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.tlc-respins.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.tlc }}
      - name: Fail unless tlc-shared succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.tlc-shared.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.tlc }}
      - name: Fail unless tlc-scan succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.tlc-scan.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.tlc }}

  # Feeds archive + metadata pairs freshly produced by the in-tree cabin
  # binary through the server's full publish validation path, so the
  # client's canonical output and the server's schema cannot drift apart.
  conformance:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # No caches: a pull request's saves serve only that pull request,
      # which rarely restores them.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
          rustflags: ""

      - name: Generate fixtures with the in-tree cabin
        run: cargo gen-fixtures "$RUNNER_TEMP/fixtures"

      # rust.yml's run is gated on filters that match nothing under
      # registry/, so a registry/Cargo.toml change is checked here.
      - name: Filter coverage guard
        run: cargo workflow-filter-coverage

      - name: Validate the generated fixtures against the server rules
        working-directory: registry
        run: cargo test --locked --verbose --test publish_validation -- --include-ignored --show-output
        env:
          CABIN_REGISTRY_FIXTURES: ${{ runner.temp }}/fixtures
          RUSTFLAGS: -D warnings

  # Runs every Kani proof harness in the registry crate (the
  # `#[cfg(kani)]` modules under registry/src). Kani brings its own
  # pinned nightly and compiles the crate again, so it gets its own
  # runner; the version matches the one the proofs were written against.
  kani:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.registry-build == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: registry

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # No caches: a pull request's saves serve only that pull request,
      # which rarely restores them.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
          rustflags: ""

      - name: Install Kani
        run: |
          cargo install -q "kani-verifier@=0.68.0" --locked
          cargo kani setup

      # Explicit bash for pipefail: tee must not hide a failed proof.
      - name: Verify every proof harness
        shell: bash
        run: cargo kani | tee "$RUNNER_TEMP/kani.log"

      # Kani passes a harness with a cover it never satisfies.
      - name: Require every cover satisfied
        run: cargo check-kani-report "$RUNNER_TEMP/kani.log"
        working-directory: .

  # Model-checks the TLA+ specification of the publish/verification
  # lifecycle (registry/proofs) with the pinned TLC release; the runner's
  # default JDK runs it. An exhaustive check must finish: the timeout
  # fails the job, never passes it. Gated on its own `tlc` filter: the
  # model's inputs rarely change. One job per configuration, side by
  # side since TLC already uses every core; jobs, not a matrix, so
  # registry-build reads each configuration's own result.
  tlc-respins:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.tlc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: registry/proofs

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned TLA+ tools
        run: curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar

      - name: Verify the TLA+ tools digest
        run: sha256sum --check tla2tools.jar.sha256

      - name: Check the lifecycle model (respins and revivals)
        run: java -XX:+UseParallelGC -jar tla2tools.jar -workers auto -cleanup -config RegistryLifecycle.cfg RegistryLifecycle.tla

  tlc-shared:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.tlc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: registry/proofs

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned TLA+ tools
        run: curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar

      - name: Verify the TLA+ tools digest
        run: sha256sum --check tla2tools.jar.sha256

      - name: Check the lifecycle model (shared blob)
        run: java -XX:+UseParallelGC -jar tla2tools.jar -workers auto -cleanup -config RegistryLifecycleShared.cfg RegistryLifecycle.tla

  # The shortest configuration, so it also runs the witness traps.
  tlc-scan:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.tlc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: registry/proofs

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned TLA+ tools
        run: curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar

      - name: Verify the TLA+ tools digest
        run: sha256sum --check tla2tools.jar.sha256

      - name: Check the lifecycle model (scan-rejected content)
        run: java -XX:+UseParallelGC -jar tla2tools.jar -workers auto -cleanup -config RegistryLifecycleScan.cfg RegistryLifecycle.tla

      # No caches: a pull request's saves serve only that pull request,
      # which rarely restores them.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
          rustflags: ""

      # Each trap must be violated (registry/proofs/README.md, "Non-vacuity").
      - name: Check the witness traps
        run: cargo check-tlc-witnesses --jar registry/proofs/tla2tools.jar registry/proofs/RegistryLifecycle.tla registry/proofs/RegistryLifecycle_witness.cfg registry/proofs/RegistryLifecycleShared_witness.cfg
        working-directory: .

  # Builds the Worker for a registry-relevant main push. It holds no
  # deploy credential: build scripts and proc-macros run only here
  # (registry/docs/runbook.md, "Deploy credential boundary").
  build-registry-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.registry == 'true'
    needs: changes
    runs-on: ubuntu-26.04
    outputs:
      superseded: ${{ steps.freshness.outputs.superseded }}
      pathspecs: ${{ steps.freshness.outputs.pathspecs }}
      digest: ${{ steps.manifest.outputs.digest }}
      attempt: ${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Full history so the freshness check below can walk
          # $GITHUB_SHA..origin/main.
          fetch-depth: 0

      # Accepted risk: GitHub's cache isolation only lets this
      # main-branch job restore main-scoped entries (PR caches are
      # unreachable), and dropping the cache would roughly double
      # production deploy latency.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with: # zizmor: ignore[cache-poisoning] -- accepted: low-trust runs cannot write main-scoped caches; see comment above
          target: wasm32-unknown-unknown
          cache-on-failure: false
          # The root workspace too: the gate steps below build xtask
          # crates from it.
          cache-workspaces: |
            .
            registry
          rustflags: ""

      # Skip early when main already carries a newer registry-relevant
      # commit; deploy-registry rechecks with these pathspecs.
      - name: Skip when superseded by a newer main commit
        id: freshness
        run: cargo workflow-superseded --relevant-to registry --emit-pathspecs

      # Changed D1 migrations must be applied by hand before the Worker
      # ships (registry/docs/runbook.md, "Deploy skew"): the deploy
      # token cannot apply them, and activating Worker code built for
      # the new schema first would break the live database.
      # registry/migrations-applied is the operator's stamp of what the
      # live database runs; until it matches the migrations' content
      # again this step fails the job with the recovery as an error
      # annotation. Content, not filenames: the pre-launch wipe policy
      # edits migrations in place.
      - name: Block the deploy until changed D1 migrations are applied by hand
        if: steps.freshness.outputs.superseded != 'true'
        run: cargo workflow-migrations-pending

      - name: Install worker-build
        if: steps.freshness.outputs.superseded != 'true'
        uses: taiki-e/cache-cargo-install-action@v3.0.8
        with:
          tool: ${{ env.WORKER_BUILD }}

      - name: Build the Worker
        if: steps.freshness.outputs.superseded != 'true'
        working-directory: registry
        run: worker-build --release

      - name: Deploy-config guard
        if: steps.freshness.outputs.superseded != 'true'
        run: cargo check-deploy --require-bundle

      - name: Install wrangler
        if: steps.freshness.outputs.superseded != 'true'
        working-directory: registry
        run: npm ci --ignore-scripts

      # Bundling runs here, never next to the token: deploy-registry
      # uploads this output as-is with --no-bundle.
      - name: Bundle the Worker
        if: steps.freshness.outputs.superseded != 'true'
        working-directory: registry
        env:
          CABIN_WORKER_PREBUILT: "1"
        run: node_modules/.bin/wrangler deploy --dry-run --outdir dist

      # Guards against shipping a different or damaged artifact, not
      # against this job: it builds the artifact anyway.
      - name: Record the artifact digest
        id: manifest
        if: steps.freshness.outputs.superseded != 'true'
        shell: bash
        working-directory: registry/dist
        run: echo "digest=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        if: steps.freshness.outputs.superseded != 'true'
        with:
          name: registry-worker-${{ github.run_attempt }}
          path: registry/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Ships the artifact above on a fresh runner that compiles nothing:
  # the deploy credential never shares a runner with a build. The job
  # and Deploy step names are read by ports-publish's deploy wait.
  deploy-registry:
    # Runs, and fails, when the build failed: a skipped job would read
    # as "nothing to deploy" to ports-publish's deploy wait.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.registry == 'true' }}
    needs: [changes, build-registry-worker]
    runs-on: ubuntu-26.04
    environment: production
    env:
      DEPLOY_TAG: ${{ github.run_id }}.${{ github.run_attempt }}
      # Public account tag (also in wrangler.jsonc vars), so wrangler
      # never infers the account from the token's resource scope.
      CLOUDFLARE_ACCOUNT_ID: 7bd7dbea3c4c76cd396153fb0e92178f
      SKIP: ${{ needs.build-registry-worker.outputs.superseded == 'true' }}
    concurrency:
      group: deploy-registry
      # Queue burst deploys instead of cancelling all but the newest
      # pending one; superseded runs skip their Deploy step and stay
      # green, every other run deploys and confirms it, or fails.
      queue: max
      cancel-in-progress: false

    steps:
      # A rerun of this job alone would reuse the build's stale
      # freshness answer: only "Re-run all jobs" can deploy.
      - name: Require this attempt's Worker build
        env:
          BUILD: ${{ needs.build-registry-worker.result }}
          BUILD_ATTEMPT: ${{ needs.build-registry-worker.outputs.attempt }}
        run: |
          test "$BUILD" = success
          if [ "$BUILD_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo "::error title=Registry deploy needs a fresh build::Use Re-run all jobs: the build job's freshness check is from attempt $BUILD_ATTEMPT."
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        if: env.SKIP != 'true'
        with:
          persist-credentials: false
          # Full history for the freshness recheck below.
          fetch-depth: 0

      - name: Install wrangler
        if: env.SKIP != 'true'
        working-directory: registry
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8.0.2
        if: env.SKIP != 'true'
        with:
          name: registry-worker-${{ github.run_attempt }}
          path: registry/build

      # Only regular files: the digest skips anything else, and wrangler
      # would read a symlink's target into the upload.
      - name: Verify the artifact digest
        if: env.SKIP != 'true'
        shell: bash
        working-directory: registry/build
        env:
          EXPECTED: ${{ needs.build-registry-worker.outputs.digest }}
        run: |
          test -z "$(find . ! -type f ! -type d -print -quit)"
          actual=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          test -n "$EXPECTED"
          test "$actual" = "$EXPECTED"

      # The build's freshness answer is minutes old, and the queue
      # serializes deploys without ordering them: recheck, with plain git,
      # right before deploying.
      - name: Skip when superseded by a newer main commit
        id: fresh
        if: env.SKIP != 'true'
        shell: bash
        env:
          PATHSPECS: ${{ needs.build-registry-worker.outputs.pathspecs }}
        run: |
          mapfile -t specs <<< "$PATHSPECS"
          test -n "${specs[0]}"
          git fetch --quiet origin main
          newer=$(git rev-list --full-history -n 1 "$GITHUB_SHA..origin/main" -- "${specs[@]}")
          if [ -n "$newer" ]; then
            echo "main carries the newer registry commit $newer; skipping"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

      # CABIN_WORKER_PREBUILT turns wrangler.jsonc's build.command into a
      # no-op, and --no-bundle uploads the artifact without bundling.
      - name: Deploy
        if: env.SKIP != 'true' && steps.fresh.outputs.superseded != 'true'
        working-directory: registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_REGISTRY_DEPLOY_TOKEN }}
          CABIN_WORKER_PREBUILT: "1"
        run: node_modules/.bin/wrangler deploy --no-bundle --tag "$DEPLOY_TAG"

      # A zero exit from `wrangler deploy` does not say which version
      # serves; this requires the tagged one at 100%, retrying reads.
      - name: Confirm the deployed version
        if: env.SKIP != 'true' && steps.fresh.outputs.superseded != 'true'
        shell: bash
        working-directory: registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_REGISTRY_DEPLOY_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if version=$(node_modules/.bin/wrangler deployments status --json | jq -er '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id') &&
              tag=$(node_modules/.bin/wrangler versions view "$version" --json | jq -er '.annotations["workers/tag"]') &&
              [ "$tag" = "$DEPLOY_TAG" ]; then
              echo "version $version carries this run's tag $DEPLOY_TAG and takes all traffic"
              exit 0
            fi
            echo "attempt $attempt/6: the serving version is not this run's at 100%"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error title=Registry deploy unconfirmed::The Deploy step exited 0, but Cloudflare does not show this run's version serving all traffic. Re-run all jobs, which rebuilds and redeploys under a fresh tag (or skips when superseded); if it fails again, read node_modules/.bin/wrangler deployments list from registry/ and run the smoke checks (registry/docs/runbook.md, \"Deploy skew\")."
          exit 1

  # TEMPORARY PR probe for the build/deploy split; removed before merge.
  probe-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      total: ${{ steps.bundle.outputs.total }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with: # zizmor: ignore[cache-poisoning] -- temporary probe
          target: wasm32-unknown-unknown
          cache: false
          rustflags: ""
      - uses: taiki-e/cache-cargo-install-action@v3.0.8
        with:
          tool: ${{ env.WORKER_BUILD }}
      - name: Build
        working-directory: registry
        run: worker-build --release
      - name: Install wrangler
        working-directory: registry
        run: npm ci --ignore-scripts
      - name: Bundle (the build job's step)
        id: bundle
        shell: bash
        working-directory: registry
        env:
          CABIN_WORKER_PREBUILT: "1"
        run: |
          node_modules/.bin/wrangler deploy --dry-run --outdir dist 2>&1 | tee bundle.log
          echo "total=$(grep -o 'Total Upload: .*' bundle.log)" >> "$GITHUB_OUTPUT"
      - name: Record the artifact digest
        id: manifest
        shell: bash
        working-directory: registry/dist
        run: echo "digest=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Plant state a later job must not inherit
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          printf '#!/bin/sh\necho PLANTED\n' > "$RUNNER_TEMP/fakebin/wrangler"
          chmod +x "$RUNNER_TEMP/fakebin/wrangler"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          nohup sleep 3600 > /dev/null 2>&1 &
          echo "probe-planted" > /tmp/probe-planted
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: probe-worker-${{ github.run_attempt }}
          path: registry/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  probe-deploy:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: probe-build
    runs-on: ubuntu-26.04
    steps:
      - name: Require this attempt's build (the deploy job's step)
        env:
          BUILD: ${{ needs.probe-build.result }}
        run: test "$BUILD" = success
      - name: Nothing from the build runner survives
        shell: bash
        run: |
          test ! -e /tmp/probe-planted
          if pgrep -x sleep; then exit 1; fi
          case ":$PATH:" in *fakebin*) exit 1 ;; esac
          if command -v worker-build; then exit 1; fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install wrangler
        working-directory: registry
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: probe-worker-${{ github.run_attempt }}
          path: registry/build
      - name: Verify the artifact digest (the deploy job's step)
        shell: bash
        working-directory: registry/build
        env:
          EXPECTED: ${{ needs.probe-build.outputs.digest }}
        run: |
          test -z "$(find . ! -type f ! -type d -print -quit)"
          actual=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          test -n "$EXPECTED"
          test "$actual" = "$EXPECTED"
      - name: The digest check refuses a changed or symlinked artifact
        shell: bash
        working-directory: registry
        env:
          EXPECTED: ${{ needs.probe-build.outputs.digest }}
        run: |
          verify() (cd "$1" && test -z "$(find . ! -type f ! -type d -print -quit)" && test "$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" = "$EXPECTED")
          verify build
          cp -R build flipped && printf 'x' >> flipped/index.js
          if verify flipped; then exit 1; fi
          cp -R build linked && ln -s /etc/hostname linked/extra.wasm
          if verify linked; then exit 1; fi
      - name: Without CABIN_WORKER_PREBUILT, wrangler would rebuild (contrast)
        shell: bash
        working-directory: registry
        run: |
          if node_modules/.bin/wrangler deploy --no-bundle --dry-run --outdir /tmp/contrast > contrast.log 2>&1; then exit 1; fi
          grep 'worker-build' contrast.log
      - name: The deploy command uploads exactly the build job's bundle
        shell: bash
        working-directory: registry
        env:
          CABIN_WORKER_PREBUILT: "1"
          TOTAL: ${{ needs.probe-build.outputs.total }}
        run: |
          node_modules/.bin/wrangler deploy --no-bundle --dry-run --outdir "$RUNNER_TEMP/out" 2>&1 | tee deploy.log
          grep -qF "$TOTAL" deploy.log
          for f in build/*.wasm build/index.js; do cmp "$f" "$RUNNER_TEMP/out/$(basename "$f")"; done
          grep -q 'Durable Object' deploy.log
          grep -q 'D1 Database' deploy.log
