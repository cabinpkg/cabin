name: Registry

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: pushes, merge groups, dispatches, calls,
# and schedules are never cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which shared path filters (.github/path-filters.yml) match this
  # push, pull request, or merge group; the work jobs below skip
  # when theirs does not. Every gated required context is an
  # always() aggregate below that fails closed on a failed gate.
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      registry: ${{ steps.filter.outputs.registry }}
    steps:
      # The filter file is read from the checkout, and push events
      # diff against the previous head from local history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  # Format, clippy, and the build share one runner: alone, each of
  # the cheap checks is dominated by checkout and toolchain setup.
  # Cheapest first, so a formatting slip fails in seconds. Branch
  # protection pins `registry-build` below, never this job.
  registry-build-work:
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: registry

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: wasm32-unknown-unknown
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The root workspace too: the guard steps below build an
          # xtask crate from it.
          workspaces: |
            .
            registry

      - name: Check formatting
        run: cargo fmt --all --verbose -- --check

      - name: Clippy (host)
        run: cargo clippy --all-targets --locked --verbose -- -D warnings

      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --locked --verbose -- -D warnings

      # Run from the repository root: the cargo aliases name
      # root-workspace packages (AGENTS.md, "Repository automation").
      - name: SQL consolidation guard
        run: cargo check-sql
        working-directory: .

      - name: R2 acquisition guard
        run: cargo check-r2
        working-directory: .

      - name: Run host-target tests
        run: cargo test --locked --verbose -- --show-output
        env:
          RUSTFLAGS: -D warnings

      - name: Worker build
        run: |
          cargo install -q "worker-build@=0.8.5" --locked
          worker-build --release

      # After the build so the bundle export check runs against the
      # artifact wrangler would actually deploy.
      - name: Deploy-config guard
        run: cargo check-deploy --require-bundle
        working-directory: .

  # Branch protection pins this, not `registry-build-work`: `always()`,
  # never `!cancelled()`, fails it closed on a failed or cancelled gate.
  registry-build:
    needs: [changes, registry-build-work]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Fail unless registry-build-work succeeded or the filter skipped it
        env:
          RESULT: ${{ needs.registry-build-work.result }}
          GATE: ${{ needs.changes.result }}
          REGISTRY: ${{ needs.changes.outputs.registry }}
        run: |
          if [ "$RESULT" = "success" ]; then exit 0; fi
          [ "$RESULT" = "skipped" ] && [ "$GATE" = "success" ] \
            && [ "$REGISTRY" = "false" ]

  # Feeds archive + metadata pairs freshly produced by the in-tree cabin
  # binary through the server's full publish validation path, so the
  # client's canonical output and the server's schema cannot drift apart.
  conformance:
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            registry

      - name: Generate fixtures with the in-tree cabin
        run: cargo gen-fixtures "$RUNNER_TEMP/fixtures"

      - name: Validate the generated fixtures against the server rules
        working-directory: registry
        run: cargo test --locked --verbose --test publish_validation -- --include-ignored --show-output
        env:
          CABIN_REGISTRY_FIXTURES: ${{ runner.temp }}/fixtures
          RUSTFLAGS: -D warnings

  # Ships the Worker once the jobs above are green. No build step of
  # its own: `wrangler deploy` runs wrangler.jsonc's build.command.
  # D1 migrations stay manual - the deploy token cannot apply them
  # (registry/docs/runbook.md, "Deploy skew").
  deploy-registry:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [registry-build-work, conformance]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-registry
      # Queue burst deploys instead of cancelling all but the newest
      # pending one; stale runs skip their Deploy step and stay green.
      queue: max
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the freshness check below can walk
          # $GITHUB_SHA..origin/main.
          fetch-depth: 0

      - run: rustup target add wasm32-unknown-unknown

      # Accepted risk: GitHub's cache isolation only lets this
      # main-branch job restore main-scoped entries (PR caches are
      # unreachable), and dropping the cache would roughly double
      # production deploy latency.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: # zizmor: ignore[cache-poisoning] -- accepted: low-trust runs cannot write main-scoped caches; see comment above
          # The root workspace too: the freshness step below builds an
          # xtask crate from it.
          workspaces: |
            .
            registry

      # The concurrency group serializes deploys but does not order
      # them: an older run whose gate finished late would deploy after
      # a newer one. Skip instead when main already carries a newer
      # registry-relevant commit (the `registry` list in
      # .github/path-filters.yml) - that commit's own run deploys, or
      # its gate is red and nothing should.
      - name: Skip when superseded by a newer main commit
        id: freshness
        run: cargo workflow-superseded --relevant-to registry

      # Changed D1 migrations must be applied by hand before the Worker
      # ships (registry/docs/runbook.md): the deploy token cannot apply
      # them, and activating Worker code built for the new schema first
      # would break the live database. registry/migrations-applied is
      # the operator's stamp of what the live database runs; deploys
      # stay blocked until it matches the migrations' content again.
      # Content, not filenames: the pre-launch wipe policy edits
      # migrations in place.
      - name: Skip until changed D1 migrations are applied by hand
        id: migrations
        run: cargo workflow-migrations-pending

      - name: Deploy
        if: >-
          steps.freshness.outputs.superseded != 'true' &&
          steps.migrations.outputs.pending != 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_REGISTRY_DEPLOY_TOKEN }}
          # Public account tag (also in wrangler.jsonc vars); pinning it
          # here keeps deploy independent of account inference from the
          # token's resource scope.
          accountId: 7bd7dbea3c4c76cd396153fb0e92178f
          # Keep deployment on the audited CLI version instead of the
          # action's default or a moving major tag.
          wranglerVersion: "4.112.0"
          workingDirectory: registry
