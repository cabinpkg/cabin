name: CodeQL skip probe

# TEMPORARY: a matrix job whose steps all skip, as codeql.yml's do on
# merge_group, must still report its named contexts as successes.
on:
  pull_request:

permissions: {}

jobs:
  analyze:
    name: Probe (${{ matrix.language }})
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - if: github.event_name != 'pull_request'
        run: exit 1
      - if: matrix.language == 'rust' && github.event_name != 'pull_request'
        run: exit 1

  assert:
    needs: analyze
    if: always()
    runs-on: ubuntu-slim
    steps:
      - run: test "${{ needs.analyze.result }}" = success
