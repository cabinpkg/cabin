name: Registry Verify

# The verification lifecycle's external verifier
# (docs/remote-registry.md, "Verification lifecycle"): list pending
# versions through the admin API, inspect each archive with
# cabin-registry-verify, and PATCH the verdict back.  A failed run
# leaves versions pending - fail-safe by design.  The registry's
# stuck-pending webhook alert is the detection mechanism
# (registry/docs/runbook.md, "Verification pipeline").
#
# Manual dispatch only while the registry is in private alpha; the
# 5-minute cron returns at launch (runbook, "Launch checklist").
# What a run verifies is whatever the registry reports as pending,
# never this repository's files; the dispatch inputs below only
# select among those pending versions.
on:
  workflow_dispatch:
    # Operator resolution of ONE abstained version (runbook,
    # "Verification pipeline"); all empty = a normal pass.
    inputs:
      resolve:
        description: "Abstained version to resolve, as <scope>/<name>@<version>[#<revision>]; empty runs a normal pass"
        required: false
        default: ""
      resolution:
        description: "verify = waive the name advisories, the real checks still render the verdict; reject = deliver a name_advisory rejection"
        type: choice
        options:
          - verify
          - reject
        default: verify
      reason:
        description: "reject only: the advisory rule, delivered as 'name_advisory: <rule>'"
        required: false
        default: ""
      check_oidc:
        description: "Diagnostics only: prove the OIDC grant and the token exchange round trip (mint, exchange, revoke); verifies nothing"
        type: boolean
        default: false

permissions: {}

# Runs must never overlap: a run that lists a version while an
# earlier run is mid-verdict could double-report.  A queued run
# supersedes any previously queued one; the running one finishes.
concurrency:
  group: registry-verify

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bounded well inside the exchanged registry token's 30-minute
    # lifetime.
    timeout-minutes: 15
    permissions:
      contents: read
      # Verdicts authenticate this run's own OIDC JWT, pinned
      # server-side by the VERIFIER_* vars in registry/wrangler.jsonc;
      # the same grant mints the run's verify-scoped registry token
      # through the trusted-publishing exchange (no token secret).
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the verifier
        run: cargo build --release --locked -p cabinpkg-registry-verify

      - name: Verify pending versions
        env:
          # The registry to verify.  Repository variables tune the
          # verifier's caps; unset variables arrive as empty strings,
          # which the verifier treats as "use the default".
          REGISTRY_ORIGIN: ${{ vars.REGISTRY_VERIFY_ORIGIN || 'https://registry.cabinpkg.com' }}
          EXPECTED_API_ORIGIN: ${{ vars.REGISTRY_VERIFY_API_ORIGIN || 'https://cabinpkg.com' }}
          VERIFY_RATIO_CAP: ${{ vars.VERIFY_RATIO_CAP }}
          VERIFY_ABS_CAP_BYTES: ${{ vars.VERIFY_ABS_CAP_BYTES }}
          VERIFY_MAX_ENTRIES: ${{ vars.VERIFY_MAX_ENTRIES }}
          VERIFY_MAX_PATH_LEN: ${{ vars.VERIFY_MAX_PATH_LEN }}
          # The dispatch inputs, as env so the run stays a plain
          # invocation.  A plain dispatch still submits the action
          # default; the client keys the resolution off `resolve`
          # and the diagnostic mode off `check_oidc`.
          VERIFY_RESOLVE: ${{ inputs.resolve }}
          VERIFY_RESOLVE_ACTION: ${{ inputs.resolution }}
          VERIFY_RESOLVE_REASON: ${{ inputs.reason }}
          VERIFY_CHECK_OIDC: ${{ inputs.check_oidc }}
        run: cargo registry-verify
