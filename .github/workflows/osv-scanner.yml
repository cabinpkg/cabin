name: Advisories

# Not a required check. It scans every lockfile against OSV on PRs
# that change one, and weekly for advisories published since; the
# accepted ones are in osv-scanner.toml.
on:
  pull_request:
    paths:
      - "**/Cargo.lock"
      - "**/package-lock.json"
      - "osv-scanner.toml"
      - ".github/workflows/osv-scanner.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Deny-all by default; the job below requests only what it needs.
permissions: {}

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: schedules and dispatches are never
# cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout of this repository only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go checksum database pins the module this version names.
      # --no-ignore: a .gitignore rule must not hide a tracked lockfile.
      - name: Scan lockfiles
        run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0 scan source -r --no-ignore --config osv-scanner.toml .
