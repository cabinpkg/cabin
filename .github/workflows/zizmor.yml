name: Audit GitHub Actions workflows

# Not a required check, and it audits only .github/. The filtered main
# push re-audits the final state after relevant merges (there is no
# merge_group run); a dispatch covers an out-of-band audit (e.g. a new
# advisory on a pinned action).
on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]
  workflow_dispatch:

# Deny-all by default; the job below requests only what it needs.
permissions: {}

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: main pushes and dispatches are never
# cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-slim
    permissions:
      contents: read # checkout of this repository only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }} # enables online audits (e.g. known-vulnerable-actions)
        # pipx ships preinstalled on ubuntu-slim; `pipx run` avoids the
        # ~/.local/bin PATH gap that breaks `pip install --user` console
        # scripts on this image.
        run: pipx run zizmor==1.28.0 .
