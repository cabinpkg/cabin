# Temporary PR probe for release.yml's on-main job; removed before merge.
name: Probe release gate

on: pull_request

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Main's own tip passes
        run: git merge-base --is-ancestor "$(git rev-parse refs/remotes/origin/main)" refs/remotes/origin/main
      - name: The pull request's merge commit is refused
        run: "! git merge-base --is-ancestor \"$GITHUB_SHA\" refs/remotes/origin/main"
