name: Proofs

# Checks the Lean mechanization under proofs/standard-compatibility.

# No job here backs a required check, so scoping happens at the
# trigger: a filtered-out run blocks nothing. There is no merge_group
# run; the filtered main push is the advisory final-state check after
# relevant merges. Keep both lists equal.
on:
  push:
    branches: [main]
    paths:
      - "proofs/**"
      - "docs/design/standard-compatibility/**"
      - ".github/workflows/proofs.yml"
  pull_request:
    paths:
      - "proofs/**"
      - "docs/design/standard-compatibility/**"
      - ".github/workflows/proofs.yml"

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: main pushes are never cancelled or
# queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@v1.6.2
        with:
          lake-package-directory: proofs/standard-compatibility
