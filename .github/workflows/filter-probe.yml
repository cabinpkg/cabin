name: Filter probe

# TEMPORARY: runs the change gate's filters over synthetic commits;
# removed before merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: start
        run: |
          git config user.name probe
          git config user.email probe@example.invalid
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: c-outside
        run: echo "// probe" >> crates/xtask-ci/src/lib.rs && git add -A && git commit -qm outside && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Without a token, dorny diffs `base` against the checked-out HEAD.
      - uses: dorny/paths-filter@v4.0.3
        id: outside
        with:
          token: ""
          base: ${{ steps.start.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - id: c-verify
        run: echo "// probe" >> crates/cabin-registry-verify/src/lib.rs && git add -A && git commit -qm verify && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: verify
        with:
          token: ""
          base: ${{ steps.c-outside.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - id: c-core
        run: echo "// probe" >> crates/cabin-core/src/lib.rs && git add -A && git commit -qm core && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: core
        with:
          token: ""
          base: ${{ steps.c-verify.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - id: c-cli
        run: echo "// probe" >> crates/cabin/src/cli/tree.rs && git add -A && git commit -qm cli && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: cli
        with:
          token: ""
          base: ${{ steps.c-core.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - id: c-newcrate
        run: mkdir -p crates/cabin-probe/src && echo "// probe" > crates/cabin-probe/src/lib.rs && git add -A && git commit -qm newcrate && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: newcrate
        with:
          token: ""
          base: ${{ steps.c-cli.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - id: c-toolchain
        run: echo "# probe" >> rust-toolchain.toml && git add -A && git commit -qm toolchain && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: toolchain
        with:
          token: ""
          base: ${{ steps.c-newcrate.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - id: c-port
        run: echo "# probe" >> ports/README.md && git add -A && git commit -qm port && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: port
        with:
          token: ""
          base: ${{ steps.c-toolchain.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - id: c-workflow
        run: echo "# probe" >> .github/workflows/ports-publish.yml && git add -A && git commit -qm workflow && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: workflow
        with:
          token: ""
          base: ${{ steps.c-port.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - id: c-gitattributes
        run: echo "# probe" >> .gitattributes && git add -A && git commit -qm gitattributes && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: gitattributes
        with:
          token: ""
          base: ${{ steps.c-workflow.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - id: c-rename
        run: git mv crates/cabin-core/src/lib.rs crates/xtask-ci/src/probe_moved.rs && git add -A && git commit -qm rename && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: rename
        with:
          token: ""
          base: ${{ steps.c-gitattributes.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - id: c-docs
        run: echo "probe" >> docs/architecture.md && git add -A && git commit -qm docs && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: docs
        with:
          token: ""
          base: ${{ steps.c-rename.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

      - uses: dorny/paths-filter@v4.0.3
        id: docs-inline
        with:
          token: ""
          base: ${{ steps.c-rename.outputs.sha }}
          filters: |
            changed:
              - ".github/path-filters.yml"

      # Drops the filter file from the two lists gating the coverage
      # guard; changes.yml's inline step must still see the edit.
      - id: c-selfdrop
        run: sed -i -e '/^rust:/,/^$/{/"\.github\/path-filters\.yml"/d}' -e '/^registry:/,/^$/{/"\.github\/path-filters\.yml"/d}' .github/path-filters.yml && git diff --stat && git add -A && git commit -qm selfdrop && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: selfdrop
        with:
          token: ""
          base: ${{ steps.c-docs.outputs.sha }}
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes
      - uses: dorny/paths-filter@v4.0.3
        id: selfdrop-inline
        with:
          token: ""
          base: ${{ steps.c-docs.outputs.sha }}
          filters: |
            changed:
              - ".github/path-filters.yml"

      # One `scenario.filter=value` per line; any mismatch fails the step.
      - name: Assert the filter outputs
        env:
          GOT: |
            outside.ports-dry-run=${{ steps.outside.outputs.ports-dry-run }}
            outside.registry-build=${{ steps.outside.outputs.registry-build }}
            outside.registry=${{ steps.outside.outputs.registry }}
            verify.ports-dry-run=${{ steps.verify.outputs.ports-dry-run }}
            verify.registry-build=${{ steps.verify.outputs.registry-build }}
            core.ports-dry-run=${{ steps.core.outputs.ports-dry-run }}
            core.registry-build=${{ steps.core.outputs.registry-build }}
            cli.ports-dry-run=${{ steps.cli.outputs.ports-dry-run }}
            cli.registry-build=${{ steps.cli.outputs.registry-build }}
            cli.registry=${{ steps.cli.outputs.registry }}
            newcrate.ports-dry-run=${{ steps.newcrate.outputs.ports-dry-run }}
            newcrate.registry-build=${{ steps.newcrate.outputs.registry-build }}
            toolchain.ports-dry-run=${{ steps.toolchain.outputs.ports-dry-run }}
            toolchain.registry-build=${{ steps.toolchain.outputs.registry-build }}
            port.ports-dry-run=${{ steps.port.outputs.ports-dry-run }}
            port.registry-build=${{ steps.port.outputs.registry-build }}
            workflow.ports-dry-run=${{ steps.workflow.outputs.ports-dry-run }}
            workflow.registry-build=${{ steps.workflow.outputs.registry-build }}
            gitattributes.ports-dry-run=${{ steps.gitattributes.outputs.ports-dry-run }}
            gitattributes.registry-build=${{ steps.gitattributes.outputs.registry-build }}
            gitattributes.rust=${{ steps.gitattributes.outputs.rust }}
            rename.ports-dry-run=${{ steps.rename.outputs.ports-dry-run }}
            rename.registry-build=${{ steps.rename.outputs.registry-build }}
            docs.ports-dry-run=${{ steps.docs.outputs.ports-dry-run }}
            docs.registry-build=${{ steps.docs.outputs.registry-build }}
            docs.registry=${{ steps.docs.outputs.registry }}
            docs.website=${{ steps.docs.outputs.website }}
            docs.filter-file=${{ steps.docs-inline.outputs.changed }}
            selfdrop.rust=${{ steps.selfdrop.outputs.rust }}
            selfdrop.registry=${{ steps.selfdrop.outputs.registry }}
            selfdrop.registry-build=${{ steps.selfdrop.outputs.registry-build }}
            selfdrop.filter-file=${{ steps.selfdrop-inline.outputs.changed }}
          WANT: |
            outside.ports-dry-run=false
            outside.registry-build=true
            outside.registry=true
            verify.ports-dry-run=false
            verify.registry-build=true
            core.ports-dry-run=true
            core.registry-build=true
            cli.ports-dry-run=true
            cli.registry-build=false
            cli.registry=true
            newcrate.ports-dry-run=true
            newcrate.registry-build=true
            toolchain.ports-dry-run=true
            toolchain.registry-build=true
            port.ports-dry-run=true
            port.registry-build=false
            workflow.ports-dry-run=true
            workflow.registry-build=false
            gitattributes.ports-dry-run=true
            gitattributes.registry-build=false
            gitattributes.rust=false
            rename.ports-dry-run=true
            rename.registry-build=true
            docs.ports-dry-run=false
            docs.registry-build=false
            docs.registry=false
            docs.website=true
            docs.filter-file=false
            selfdrop.rust=false
            selfdrop.registry=false
            selfdrop.registry-build=true
            selfdrop.filter-file=true
        run: diff <(echo "$WANT") <(echo "$GOT") && echo "all 32 match"
