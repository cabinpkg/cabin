name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  dist:
    uses: ./.github/workflows/dist.yml

  release:
    runs-on: ubuntu-24.04
    needs: dist
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # OIDC identity for the attestation signature
      attestations: write # store the attestations
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cabin-*
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      # Attest the exact archives the release publishes; verifiable
      # with `gh attestation verify`.
      - name: Attest binary archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.xz
            artifacts/*.zip

      - name: Download demo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo.gif
          path: artifacts

      - name: Release
        # Swapping the release action for a `gh release` script would
        # change release behavior; AGENTS.md forbids changing release
        # workflow behavior as part of unrelated work.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with: # zizmor: ignore[superfluous-actions] -- AGENTS.md defers release-behavior changes; a gh-cli migration is separate release work
          draft: false
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
