name: Dist

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_call:

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: merge groups and calls are never
# cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which shared path filters (.github/path-filters.yml) match this
  # pull request or merge group; the work jobs below skip when theirs
  # does not. Every gated required context is an always() aggregate
  # below that fails closed on a failed gate.
  changes:
    if: github.ref_type != 'tag'
    # The gate's token comes from this job: a called workflow can
    # never exceed the calling job's permissions.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  binaries:
    needs: changes
    if: ${{ !cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.dist == 'true') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04

          - target: x86_64-pc-windows-msvc
            runner: windows-2025-vs2026

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

          - target: aarch64-apple-darwin
            runner: macos-26

          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # No caches: a release build restores nothing, and a pull request's
      # saves serve only that pull request.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Build binary
        shell: bash
        run: cargo build --bin cabin --release --locked --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail

          package_path="$(cargo dist-package --target "${{ matrix.target }}" \
            --ref-name "$GITHUB_REF_NAME" --ref-type "${GITHUB_REF_TYPE:-}" \
            --sha "$GITHUB_SHA")"

          echo "PACKAGE_PATH=${package_path}" >> "$GITHUB_ENV"

      # The archive must unpack to a binary that runs here and reports
      # the workspace version, which a tag must equal.
      - name: Run the packaged binary
        shell: bash
        run: cargo dist-check "$PACKAGE_PATH" --ref-name "$GITHUB_REF_NAME" --ref-type "${GITHUB_REF_TYPE:-}"

      - name: Upload binary archive
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ env.PACKAGE_PATH }}
          archive: false
          if-no-files-found: error

  # Branch protection pins this instead of `binaries`, whose skip on
  # a cancelled run or a failed gate would read green. `always()`,
  # never `!cancelled()`: a cancelled run must fail this check, not
  # skip it to a green required check. Renaming this job requires
  # updating the ruleset's required context in the same operation.
  dist-required:
    needs: [changes, binaries]
    if: always()
    runs-on: ubuntu-slim
    steps:
      # The gate logic is a local action; the sparse checkout keeps
      # this fetch small.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/required-gate
      - name: Fail unless binaries succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.binaries.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.dist }}
