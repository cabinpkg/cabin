name: Dist

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_call:

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: pushes, merge groups, dispatches, calls,
# and schedules are never cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which shared path filters (.github/path-filters.yml) match this
  # push, pull request, or merge group; the work jobs below skip
  # when theirs does not. Every gated required context is an
  # always() aggregate below that fails closed on a failed gate.
  changes:
    if: github.ref_type != 'tag'
    # The gate's token comes from this job: a called workflow can
    # never exceed the calling job's permissions.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  demo:
    needs: changes
    if: ${{ !cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.dist == 'true') }}
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-on-failure: false
          rustflags: ""

      - parallel:
        # zsh is the only tool left on apt; retries and timeouts keep
        # a stalled mirror from hanging the job.
        - name: Install zsh
          run: |
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y zsh

        # Pinned static release builds: apt's ffmpeg dependency tree
        # alone took ~10 minutes on this image. Pin ffmpeg to a BtbN
        # MONTH-END autobuild (kept two years); dailies prune after 14
        # days and would 404 here.
        - name: Install ffmpeg, ttyd, and bat
          working-directory: ${{ runner.temp }}
          run: |
            wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-gpl-8.1.tar.xz
            tar -xJf ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-gpl-8.1.tar.xz
            sudo mv ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-gpl-8.1/bin/ffmpeg /usr/local/bin
            wget -q -O ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
            chmod +x ttyd
            sudo mv ttyd /usr/local/bin
            wget -q https://github.com/sharkdp/bat/releases/download/v0.26.1/bat-v0.26.1-x86_64-unknown-linux-musl.tar.gz
            tar -xzf bat-v0.26.1-x86_64-unknown-linux-musl.tar.gz
            sudo mv bat-v0.26.1-x86_64-unknown-linux-musl/bat /usr/local/bin

        - name: Build and Install Cabin Binary (release)
          run: |
            cargo build --bin cabin --release --locked
            sudo cp target/release/cabin /usr/local/bin

        - name: Install VHS
          run: |
            wget https://github.com/charmbracelet/vhs/releases/download/v0.11.0/vhs_0.11.0_Linux_x86_64.tar.gz
            tar -xzf vhs_0.11.0_Linux_x86_64.tar.gz
            sudo mv vhs_0.11.0_Linux_x86_64/vhs /usr/local/bin

        - name: Install Nerd Font
          run: |
            mkdir -p ~/.local/share/fonts
            wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.3.0/FiraCode.zip
            unzip FiraCode.zip -d ~/.local/share/fonts/
            fc-cache -fv

        - name: Install zsh-syntax-highlighting
          run: |
            git clone https://github.com/zsh-users/zsh-syntax-highlighting.git ~/z
            echo 'source ~/z/zsh-syntax-highlighting.zsh' >> ~/.zshrc

        - name: Install Starship
          run: |
            curl -sS https://starship.rs/install.sh | sh -s -- -y
            printf "%s\n" "eval \"\$(starship init zsh)\"" >> ~/.zshrc

      - name: Generate a new demo
        run: vhs demo.tape

      - name: Upload demo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: demo.gif
          archive: false
          if-no-files-found: error

  binaries:
    needs: changes
    if: ${{ !cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.dist == 'true') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04

          - target: x86_64-pc-windows-msvc
            runner: windows-2025-vs2026

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

          - target: aarch64-apple-darwin
            runner: macos-26

          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache-on-failure: false
          rustflags: ""

      - name: Build binary
        shell: bash
        run: cargo build --bin cabin --release --locked --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail

          package_path="$(cargo dist-package --target "${{ matrix.target }}" \
            --ref-name "$GITHUB_REF_NAME" --ref-type "${GITHUB_REF_TYPE:-}" \
            --sha "$GITHUB_SHA")"

          echo "PACKAGE_PATH=${package_path}" >> "$GITHUB_ENV"

      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.PACKAGE_PATH }}
          archive: false
          if-no-files-found: error

  # Branch protection pins this instead of `binaries`, whose skip on
  # a cancelled run or a failed gate would read green. `always()`,
  # never `!cancelled()`: a cancelled run must fail this check, not
  # skip it to a green required check. Fails closed when the gate
  # itself failed. Renaming this job requires updating the ruleset's
  # required context in the same operation.
  dist-required:
    needs: [changes, binaries]
    if: always()
    runs-on: ubuntu-slim
    steps:
      # The gate logic is a local action; the sparse checkout keeps
      # this fetch small.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/required-gate
      - name: Fail unless binaries succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.binaries.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.dist }}
