name: CI

on:
  pull_request:
    # `edited` re-runs the squash-title check when the PR title changes.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: merge groups are never cancelled or
# queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLICOLOR: 1

jobs:
  # The spelling and action-lockfile checks share this runner: all
  # are seconds of work, dominated by checkout and setup.
  commitlint:
    runs-on: ubuntu-slim
    # commitlint loads its config and locked node_modules from here; git
    # still finds the repository, and uses: steps (typos) run at the root.
    defaults:
      run:
        working-directory: .github/commitlint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: crate-ci/typos@v1.51.1

      # gh actions-lock reads .github/workflows from the working
      # directory; .github/AGENTS.md has the lockfile procedure.
      - name: Verify the actions lockfile
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify

      # A merge group's commit is GitHub-generated, so only typos and
      # the lockfile check run there; the commitlint steps validate the
      # real PR commits and the squash title the merge would generate.
      - name: Setup node
        if: github.event_name != 'merge_group'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: .github/commitlint/package-lock.json

      - name: Install commitlint
        if: github.event_name != 'merge_group'
        run: npm ci --ignore-scripts

      - name: Print versions
        if: github.event_name != 'merge_group'
        run: |
          git --version
          node --version
          npm --version
          npx commitlint --version

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      # The squash merge titles the main commit with the commit
      # subject (single-commit PR) or the PR title (multi-commit,
      # COMMIT_OR_PR_TITLE) and appends " (#N)" either way; lint the
      # exact generated string.
      - name: Validate the single-commit squash title with commitlint
        if: github.event_name == 'pull_request' && github.event.pull_request.commits == 1
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git log -1 --format="%s (#$PR_NUMBER)" "$HEAD_SHA" | npx commitlint --verbose

      - name: Validate the multi-commit squash title with commitlint
        if: github.event_name == 'pull_request' && github.event.pull_request.commits > 1
        env:
          SQUASH_TITLE: ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})
        run: printf '%s\n' "$SQUASH_TITLE" | npx commitlint --verbose
