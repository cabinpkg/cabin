name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: pushes, merge groups, dispatches, calls,
# and schedules are never cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLICOLOR: 1

jobs:
  # The spelling check shares this runner: both checks are seconds
  # of work, dominated by checkout and setup.
  commitlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

      # A merge group's commit is GitHub-generated, so only typos runs
      # there; the commitlint steps validate real PR and main commits.
      - name: Setup node
        if: github.event_name != 'merge_group'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install commitlint
        if: github.event_name != 'merge_group'
        # zizmor: ignore[adhoc-packages] -- accepted CI-integrity risk; adding a root Node manifest + lockfile for this lint-only tool is a dedicated tooling follow-up
        run: npm install -D @commitlint/cli @commitlint/config-conventional

      - name: Setup commitlint
        if: github.event_name != 'merge_group'
        run: |
          echo "export default { extends: ['@commitlint/config-conventional'] };" > commitlint.config.js

      - name: Print versions
        if: github.event_name != 'merge_group'
        run: |
          git --version
          node --version
          npm --version
          npx commitlint --version

      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
