name: Foundation Port Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  real-upstream-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run ignored real-upstream registry example smoke tests
        run: |
          cargo test -p cabinpkg --test cabin_examples --all-features --locked \
            --verbose -- --ignored --show-output
        env:
          RUST_BACKTRACE: "1"
