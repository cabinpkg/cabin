name: Foundation Port Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  real-upstream-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-on-failure: false
          rustflags: ""

      - name: Run ignored real-upstream registry example smoke tests
        run: |
          cargo test -p cabinpkg --test cabin_examples --all-features --locked \
            --verbose -- --ignored --show-output
        env:
          RUST_BACKTRACE: "1"
