name: Docker

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: pushes, merge groups, dispatches, calls,
# and schedules are never cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which shared path filters (.github/path-filters.yml) match this
  # push, pull request, or merge group; the work jobs below skip
  # when theirs does not. Every gated required context is an
  # always() aggregate below that fails closed on a failed gate.
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # The filter file is read from the checkout, and push events
      # diff against the previous head from local history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  # Branch protection pins `create` below, never this job.
  create-work:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t img .

      - name: Create Docker container
        run: docker create img

  # Branch protection pins this, not `create-work`: `always()`, never
  # `!cancelled()`, fails it closed on a failed or cancelled gate.
  create:
    needs: [changes, create-work]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Fail unless create-work succeeded or the filter skipped it
        env:
          RESULT: ${{ needs.create-work.result }}
          GATE: ${{ needs.changes.result }}
          DOCKER: ${{ needs.changes.outputs.docker }}
        run: |
          if [ "$RESULT" = "success" ]; then exit 0; fi
          [ "$RESULT" = "skipped" ] && [ "$GATE" = "success" ] \
            && [ "$DOCKER" = "false" ]
