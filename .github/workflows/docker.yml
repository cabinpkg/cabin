name: Docker

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: merge groups are never cancelled or
# queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which shared path filters (.github/path-filters.yml) match this
  # pull request or merge group; the work jobs below skip when theirs
  # does not. Every gated required context is an always() aggregate
  # below that fails closed on a failed gate.
  changes:
    # The gate's token comes from this job: a called workflow can
    # never exceed the calling job's permissions.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  # Branch protection pins `create` below, never this job.
  create-work:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t img .

      - name: Create Docker container
        run: docker create img

  # Branch protection pins this, not `create-work`: `always()`, never
  # `!cancelled()`, fails it closed on a failed or cancelled gate.
  create:
    needs: [changes, create-work]
    if: always()
    runs-on: ubuntu-slim
    steps:
      # The gate logic is a local action; the sparse checkout keeps
      # this fetch small.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/required-gate
      - name: Fail unless create-work succeeded or the filter skipped it
        uses: ./.github/actions/required-gate
        with:
          result: ${{ needs.create-work.result }}
          gate-result: ${{ needs.changes.result }}
          filter-values: ${{ needs.changes.outputs.docker }}
