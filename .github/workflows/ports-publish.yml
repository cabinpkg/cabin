name: Ports Publish

# Publishes the committed foundation ports as `cabin-ports/*`
# registry packages through the repository tool
# (crates/xtask-port-publish). Pull requests run the complete
# preflight as a dry-run with no secrets; pushes to main publish the
# published set; manual dispatch from main republishes everything (the
# recovery path after a pre-launch registry wipe - dispatching any
# other ref runs the dry-run instead, never a publish). The ports tree
# and this workflow live in cabinpkg/cabin - the cabin-ports GitHub
# organization is the registry scope authority, not a separate source
# repository.
#
# The publish-pipeline crate paths mirror registry.yml's filter: they
# shape the archive + canonical-metadata bytes the published packages
# carry, and divergent bytes for an already-published version land as
# a new packaging revision - a change there must run the ports
# preflight (and republish) too, or it surfaces weeks later as a
# blocked publish on an unrelated ports PR.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ports-publish.yml"
      # The publish steps run the `cargo port-publish` alias.
      - ".cargo/config.toml"
      # Cargo.lock / root Cargo.toml: the tool builds --locked, and
      # lock-only bumps of byte-producing dependencies (zip, flate2)
      # or workspace-manifest feature flips (which need no lockfile
      # change) change the archive bytes the registry holds immutable.
      - "Cargo.lock"
      - "Cargo.toml"
      - "ports/**"
      - "crates/cabin-artifact/**"
      - "crates/xtask-port-publish/**"
      # The freshness guard the publish job runs, which decides whether
      # this run is still the newest one: without this an edit to the
      # guard would not reach the job it gates.
      - "crates/xtask-workflow-guard/**"
      - "crates/cabin-core/**"
      - "crates/cabin-manifest/**"
      - "crates/cabin-package/**"
      - "crates/cabin-publish/**"
      - "crates/cabin-registry-api/**"
  pull_request:
    paths:
      - ".github/workflows/ports-publish.yml"
      # The publish steps run the `cargo port-publish` alias.
      - ".cargo/config.toml"
      # Cargo.lock / root Cargo.toml: the tool builds --locked, and
      # lock-only bumps of byte-producing dependencies (zip, flate2)
      # or workspace-manifest feature flips (which need no lockfile
      # change) change the archive bytes the registry holds immutable.
      - "Cargo.lock"
      - "Cargo.toml"
      - "ports/**"
      - "crates/cabin-artifact/**"
      - "crates/xtask-port-publish/**"
      # The freshness guard the publish job runs, which decides whether
      # this run is still the newest one: without this an edit to the
      # guard would not reach the job it gates.
      - "crates/xtask-workflow-guard/**"
      - "crates/cabin-core/**"
      - "crates/cabin-manifest/**"
      - "crates/cabin-package/**"
      - "crates/cabin-publish/**"
      - "crates/cabin-registry-api/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  dry-run:
    # Pull requests, plus manual dispatch from a non-main ref (which
    # must never publish). --dry-run runs the identical preflight the
    # publish path runs: stage every port into a temporary file
    # registry and build every port against it.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc g++

      # Restored archives are never trusted: the tool re-hashes every
      # cached archive against the SHA-256 its port's `[package.upstream]`
      # pins before use, and re-downloads on mismatch
      # (xtask-port-publish::preflight),
      # so this cache saves bandwidth without vouching for bytes. Only
      # archives/ is cached - extracted sources/ trees are not
      # integrity-checked on reuse and stay run-local.
      - name: Cache upstream archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabin-cache/ports/archives
          key: ports-archives-${{ hashFiles('ports/**/cabin.toml') }}
          restore-keys: ports-archives-

      - name: Build cabin and the publisher
        run: cargo build --locked -p cabinpkg -p xtask-port-publish

      - name: Run the publisher dry-run
        run: |
          cargo port-publish --dry-run --cache-dir "$RUNNER_TEMP/cabin-cache"

  publish:
    # The repository guard keeps forks (which have no
    # CABIN_PORTS_TOKEN) from spending a long preflight build on a
    # publish that can only fail unauthenticated.
    if: github.repository == 'cabinpkg/cabin' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The registry-deploy wait below reads this repository's
      # workflow runs.
      actions: read
    # Serialize publish runs without cancelling an active one. The
    # group does not order runs; the freshness guard below keeps a
    # stale run from mutating the registry.
    concurrency:
      group: ports-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the freshness check below can walk
          # $GITHUB_SHA..origin/main.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc g++

      # Same checksum discipline as the dry-run job: restored bytes
      # are re-hashed against the committed SHA-256 pin before use, so
      # a poisoned cache entry cannot alter what publishes.
      - name: Cache upstream archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabin-cache/ports/archives
          key: ports-archives-${{ hashFiles('ports/**/cabin.toml') }}
          restore-keys: ports-archives-

      - name: Build cabin and the publisher
        run: cargo build --locked -p cabinpkg -p xtask-port-publish

      # Checked immediately before the publish command, after the long
      # build: the concurrency group serializes runs but does not
      # order them, and an out-of-order stale run would publish an
      # intermediate state of a version as an otherwise-unnecessary
      # packaging revision. Skip instead when
      # main already carries a newer commit matching this workflow's
      # trigger paths - that commit's own run publishes the full set.
      #
      # Accepted residual window: the publish command below runs the
      # tool's own preflight (minutes) before uploading, so a newer
      # commit can land after this check and before the upload. That
      # cannot be closed without a compare-and-swap the registry does
      # not have - only shrunk by re-running the entire preflight or
      # coupling the tool to git ordering. It needs two byte-divergent
      # edits of one published version inside a single run's window,
      # and the recovery is the newer commit's own run: its upload
      # supersedes the stale revision (docs/foundation-ports.md).
      # The path list below must stay the trigger paths above:
      # crates/xtask-workflow-guard/tests/path_parity.rs fails when the
      # three lists disagree.
      - name: Skip when superseded by a newer ports commit
        id: freshness
        run: |
          cargo workflow-superseded \
            --path .github/workflows/ports-publish.yml \
            --path .cargo/config.toml \
            --path Cargo.lock \
            --path Cargo.toml \
            --path ports/ \
            --path crates/cabin-artifact/ \
            --path crates/xtask-port-publish/ \
            --path crates/xtask-workflow-guard/ \
            --path crates/cabin-core/ \
            --path crates/cabin-manifest/ \
            --path crates/cabin-package/ \
            --path crates/cabin-publish/ \
            --path crates/cabin-registry-api/

      # A commit can change both the publish client and the Worker's
      # accepted metadata schema (registry/src mirrors the canonical
      # document under deny_unknown_fields), and registry.yml deploys
      # independently of this workflow. Publishing before the same-SHA
      # deploy lands would 400 every upload against the old Worker, so
      # wait for that run when one exists - and require the Deploy
      # *step* to have run: the deploy-registry job goes green with the
      # step skipped when the run is superseded or a D1 migration
      # awaits its by-hand apply, and both cases leave the old Worker
      # live. When the same-SHA run itself skipped its Deploy and no
      # pending run can still deliver one - the deploy-freeze shape -
      # the step records `skipped=true`, prints the reason, and ends
      # GREEN, and the publish step below gates on the flag. That arm
      # alone is green because no rerun can clear it: the freeze holds
      # until an operator applies the migration, and failing would pin
      # main red for as long as that takes. Everything a rerun DOES
      # clear stays red - a failed or cancelled Registry run, the hour
      # ceiling reached undecided, a tool dying, or the flag failing to
      # record (where a green exit would publish against the stale
      # worker). Once the deploy lands, dispatch this workflow from
      # main to publish what the freeze skipped.
      # The gate is otherwise satisfied by ANY successful main
      # Deploy whose head CONTAINS this SHA (ancestor check): when a
      # newer registry commit supersedes this SHA's run, its deploy
      # carries this SHA's schema changes, and inspecting only the
      # same-SHA run would deadlock every rerun on the permanently
      # skipped step. A commit that triggers no Registry run publishes
      # against the already-deployed Worker unchanged (residual: an
      # *earlier* registry commit whose deploy was skipped is not
      # detected here; that commit's own failure surfaces are the
      # alert). Transient API errors retry on the next iteration; the
      # ceiling covers registry.yml's cold-cache gate.
      - name: Wait for a registry deploy containing this SHA
        id: await
        if: steps.freshness.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo workflow-await-deploy

      - name: Publish to registry.cabinpkg.com
        if: steps.freshness.outputs.superseded != 'true' && steps.await.outputs.skipped != 'true'
        run: |
          cargo port-publish --publish \
            --index-url https://registry.cabinpkg.com \
            --cache-dir "$RUNNER_TEMP/cabin-cache"
        env:
          # The repository secret is named for the cabin-ports scope it
          # publishes under; cabin's credential lookup reads
          # CABIN_REGISTRY_TOKEN.
          CABIN_REGISTRY_TOKEN: ${{ secrets.CABIN_PORTS_TOKEN }}
