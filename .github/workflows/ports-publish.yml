name: Ports Publish

# Publishes the committed foundation ports as `cabin-ports/*`
# registry packages through the repository tool
# (crates/xtask-port-publish). Pull requests matching the `ports`
# filter (.github/path-filters.yml) run the complete preflight as a
# dry-run with no credentials. Publishing is manual
# only: a dispatch from main publishes the set (dispatching any
# other ref runs the dry-run instead, never a publish), so a merged
# ports change reaches the registry at the next dispatch, and the
# same dispatch is the recovery path after a pre-launch registry
# wipe. Dispatching with the exchange-check input instead only
# proves the trusted-publishing binding without publishing. Pushes
# to main run no job here. No long-lived credential exists
# anywhere in this workflow: `cabin publish` exchanges the run's OIDC
# token for a short-lived registry token and revokes it on exit
# (docs/remote-registry.md, "Publishing from GitHub Actions"). The
# ports tree and this workflow live in cabinpkg/cabin - the
# cabin-ports GitHub organization is the registry scope authority,
# not a separate source repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      exchange-check:
        description: "Exchange and immediately revoke a trusted-publishing token; publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: pushes, dispatches, calls, and schedules
# are never cancelled or queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Which shared path filters (.github/path-filters.yml) match this
  # push or pull request; the jobs below skip when theirs does not.
  # A skipped job still satisfies its required status check.
  changes:
    # Only the pull-request dry-run consumes the filter: pushes run
    # no job here and dispatches bypass the gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ports: ${{ steps.filter.outputs.ports }}
    steps:
      # The filter file is read from the checkout, and push events
      # diff against the previous head from local history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  dry-run:
    # Pull requests, plus manual dispatch from a non-main ref (which
    # must never publish). --dry-run runs the identical preflight the
    # publish path runs: stage every port into a temporary file
    # registry and build every port against it.
    needs: changes
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.changes.outputs.ports == 'true') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !inputs.exchange-check)) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Restored archives are never trusted: the tool re-hashes every
      # cached archive against the SHA-256 its port's `[package.upstream]`
      # pins before use, and re-downloads on mismatch
      # (xtask-port-publish::preflight),
      # so this cache saves bandwidth without vouching for bytes. Only
      # archives/ is cached - extracted sources/ trees are not
      # integrity-checked on reuse and stay run-local.
      - name: Cache upstream archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabin-cache/ports/archives
          key: ports-archives-${{ hashFiles('ports/**/cabin.toml') }}
          restore-keys: ports-archives-

      - name: Build cabin and the publisher
        run: cargo build --locked -p cabinpkg -p xtask-port-publish

      - name: Run the publisher dry-run
        run: |
          cargo port-publish --dry-run --cache-dir "$RUNNER_TEMP/cabin-cache"

  publish:
    # The repository guard keeps forks from spending a long preflight
    # build on a publish that can only fail: the registry's
    # trusted-publishing config pins this repository's immutable
    # numeric GitHub id, so a fork's exchange answers the uniform 401.
    if: github.repository == 'cabinpkg/cabin' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.exchange-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The registry-deploy wait below reads this repository's
      # workflow runs.
      actions: read
      # `cabin publish` exchanges the run's OIDC token for its
      # short-lived registry token (docs/remote-registry.md,
      # "Publishing from GitHub Actions"); no stored secret exists.
      id-token: write
    # Serialize publish runs without cancelling an active one. The
    # group does not order runs; the freshness guard below keeps a
    # stale run from mutating the registry.
    concurrency:
      group: ports-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the freshness check below can walk
          # $GITHUB_SHA..origin/main.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Same checksum discipline as the dry-run job: restored bytes
      # are re-hashed against the committed SHA-256 pin before use, so
      # a poisoned cache entry cannot alter what publishes.
      - name: Cache upstream archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabin-cache/ports/archives
          key: ports-archives-${{ hashFiles('ports/**/cabin.toml') }}
          restore-keys: ports-archives-

      - name: Build cabin and the publisher
        run: cargo build --locked -p cabinpkg -p xtask-port-publish

      # Checked immediately before the publish command, after the long
      # build: the concurrency group serializes runs but does not
      # order them, and an out-of-order stale run would publish an
      # intermediate state of a version as an otherwise-unnecessary
      # packaging revision. Skip instead when main already carries a
      # newer ports-relevant commit (the `ports` list in
      # .github/path-filters.yml) - the next dispatch publishes the
      # full set.
      #
      # Accepted residual window: the publish command below runs the
      # tool's own preflight (minutes) before uploading, so a newer
      # commit can land after this check and before the upload. That
      # cannot be closed without a compare-and-swap the registry does
      # not have - only shrunk by re-running the entire preflight or
      # coupling the tool to git ordering. It needs two byte-divergent
      # edits of one published version inside a single run's window,
      # and the recovery is the next dispatch: its upload supersedes
      # the stale revision (docs/foundation-ports.md).
      - name: Skip when superseded by a newer main commit
        id: freshness
        run: cargo workflow-superseded --relevant-to ports

      # A commit can change both the publish client and the Worker's
      # accepted metadata schema (registry/src mirrors the canonical
      # document under deny_unknown_fields), and registry.yml deploys
      # independently of this workflow. Publishing before the same-SHA
      # deploy lands would 400 every upload against the old Worker, so
      # wait for that run when one exists - and require the Deploy
      # *step* to have run: the deploy-registry job goes green with the
      # step skipped when the run is superseded or a D1 migration
      # awaits its by-hand apply, and both cases leave the old Worker
      # live. When the same-SHA run itself skipped its Deploy and no
      # pending run can still deliver one - the deploy-freeze shape -
      # the wait fails FAST with the reason instead of idling into its
      # hour ceiling; rerun this workflow once the deploy lands.
      # The gate is otherwise satisfied by ANY successful main
      # Deploy whose head CONTAINS this SHA (ancestor check): when a
      # newer registry commit supersedes this SHA's run, its deploy
      # carries this SHA's schema changes, and inspecting only the
      # same-SHA run would deadlock every rerun on the permanently
      # skipped step. A commit that triggers no Registry run - or
      # whose Registry run skipped its registry jobs through the
      # change gate - publishes
      # against the already-deployed Worker unchanged (residual: an
      # *earlier* registry commit whose deploy was skipped is not
      # detected here; that commit's own failure surfaces are the
      # alert). Transient API errors retry on the next iteration; the
      # ceiling covers registry.yml's cold-cache gate.
      - name: Wait for a registry deploy containing this SHA
        if: steps.freshness.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo workflow-await-deploy

      - name: Publish to registry.cabinpkg.com
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          cargo port-publish --publish \
            --index-url https://registry.cabinpkg.com \
            --cache-dir "$RUNNER_TEMP/cabin-cache"

  exchange-check:
    # Dispatch-only probe: exchange the run's OIDC token and revoke
    # the minted registry token immediately, proving the registered
    # binding end to end - config row, claimed scope, mint, revocation
    # - while publishing nothing. Plain curl rather than the cabin
    # client, which only exchanges as part of a real publish. The
    # registered config pins refs/heads/main, so dispatching any other
    # ref answers the registry's deliberately uniform 401 and fails
    # this job. No checkout: the probe needs only the run's OIDC
    # identity.
    if: github.event_name == 'workflow_dispatch' && inputs.exchange-check
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Exchange and immediately revoke a trusted-publishing token
        # Explicit bash for pipefail, so a failed fetch cannot feed an
        # empty value downstream; `jq -e` fails on a missing field for
        # the same reason. Both secrets are masked the moment they
        # exist. The DELETE asserts the 204: unlike the publish path's
        # best-effort revocation, proving revocation works is half of
        # what this probe is for.
        shell: bash
        run: |
          jwt="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cabinpkg.com" | jq -er .value)"
          echo "::add-mask::$jwt"
          token="$(curl -sSf -X PUT https://cabinpkg.com/api/v1/trusted_publishing/tokens -H "Content-Type: application/json" -d "{\"jwt\":\"$jwt\"}" | jq -er .token)"
          echo "::add-mask::$token"
          curl -sSf -o /dev/null -X DELETE https://cabinpkg.com/api/v1/trusted_publishing/tokens -H "Authorization: Bearer $token"
