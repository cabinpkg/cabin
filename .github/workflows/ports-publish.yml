name: Ports Publish

# Publishes the committed foundation ports as `cabin-ports/*` registry
# packages through crates/xtask-port-publish (docs/foundation-ports.md,
# "Publish automation"). Only a dispatch from main publishes.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      exchange-check:
        description: "Exchange and immediately revoke a trusted-publishing token; publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a PR branch cancels the PR's stale runs. Every other
# event gets a per-run group: dispatches are never cancelled or
# queued at the workflow level.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Which shared path filters (.github/path-filters.yml) match this
  # pull request; the jobs below skip when theirs does not.
  changes:
    # Only the pull-request dry-run consumes the filter: dispatches
    # bypass the gate.
    if: github.event_name == 'pull_request'
    # The gate's token comes from this job: a called workflow can
    # never exceed the calling job's permissions.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  dry-run:
    # Pull requests, plus manual dispatch from a non-main ref (which
    # must never publish): the publish preflight, then each port's
    # probe, on each platform the ports must support.
    needs: changes
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.changes.outputs.ports == 'true') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !inputs.exchange-check)) }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025-vs2026

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache-on-failure: false
          rustflags: ""

      # Untrusted: the tool re-hashes each restored archive against its
      # port's pinned SHA-256 and re-downloads on mismatch. Cache only
      # archives/: extracted sources/ trees are not re-verified on reuse.
      - name: Cache upstream archives
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/cabin-cache/ports/archives
          key: ports-archives-${{ hashFiles('ports/**/cabin.toml') }}
          restore-keys: ports-archives-

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Build cabin and the publisher
        run: cargo build --locked -p cabinpkg -p xtask-port-publish

      # The default shell: Git Bash's `link.exe` would shadow MSVC's.
      - name: Run the publisher dry-run
        env:
          CABIN_CACHE_DIR: ${{ runner.temp }}/cabin-cache
          # Windows' default %TEMP% sits on C:, slower than RUNNER_TEMP's
          # D:; the publisher's scratch tree and MSVC's temporaries follow TMP.
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo port-publish --dry-run

  publish:
    # The repository guard keeps forks from spending a long preflight
    # build on a publish that can only fail: the registry's
    # trusted-publishing config pins this repository's immutable
    # numeric GitHub id, so a fork's exchange answers the uniform 401.
    if: github.repository == 'cabinpkg/cabin' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.exchange-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The registry-deploy wait below reads this repository's
      # workflow runs.
      actions: read
      # `cabin publish` exchanges the run's OIDC token for its
      # short-lived registry token (docs/remote-registry.md,
      # "Publishing from GitHub Actions"); no stored secret exists.
      id-token: write
    # Serialize publish runs without cancelling an active one. The
    # group does not order runs; the freshness guard below keeps a
    # stale run from mutating the registry.
    concurrency:
      group: ports-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Full history so the freshness check below can walk
          # $GITHUB_SHA..origin/main.
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache-on-failure: false
          rustflags: ""

      # Re-hashed as in the dry-run job, so a poisoned entry cannot
      # alter what publishes.
      - name: Cache upstream archives
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/cabin-cache/ports/archives
          key: ports-archives-${{ hashFiles('ports/**/cabin.toml') }}
          restore-keys: ports-archives-

      - name: Build cabin and the publisher
        run: cargo build --locked -p cabinpkg -p xtask-port-publish

      # Checked after the long build, immediately before publishing: an
      # out-of-order stale run would publish an intermediate state of a
      # version as an otherwise-unnecessary packaging revision.
      # Accepted residual window: a newer commit can land during the
      # publish command's own preflight. Closing it needs a
      # compare-and-swap the registry does not have; it matters only for
      # two byte-divergent edits of one version within one run, and the
      # next dispatch's upload supersedes the stale revision
      # (docs/foundation-ports.md, "Publish automation").
      - name: Skip when superseded by a newer main commit
        id: freshness
        run: cargo workflow-superseded --relevant-to ports

      # A commit can change both the publish client and the Worker's
      # accepted metadata schema (registry/src mirrors the canonical
      # document under deny_unknown_fields), and registry.yml deploys
      # independently of this workflow, so publishing before this SHA's
      # deploy lands would 400 every upload against the old Worker. Any
      # successful main Registry run whose head contains this SHA and
      # whose Deploy step ran satisfies the wait: a newer registry
      # commit's deploy carries this SHA's schema, and waiting only on
      # the same-SHA run would deadlock every rerun once a newer run
      # supersedes it (its Deploy step stays skipped). Residual:
      # an earlier registry commit whose deploy never landed is not
      # detected here; that commit's own red deploy job is the alert.
      # The hour ceiling covers registry.yml's cold-cache gate. The
      # other answers and failure directions are in
      # crates/xtask-workflow-guard/src/await_deploy.rs.
      - name: Wait for a registry deploy containing this SHA
        if: steps.freshness.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo workflow-await-deploy

      - name: Publish to registry.cabinpkg.com
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          cargo port-publish --publish \
            --index-url https://registry.cabinpkg.com \
            --cache-dir "$RUNNER_TEMP/cabin-cache"

  exchange-check:
    # Dispatch-only probe of the registered binding end to end (config
    # row, claimed scope, mint, revocation); publishes nothing. curl,
    # because the cabin client exchanges only inside a real publish.
    # The registered config pins refs/heads/main, so any other ref gets
    # the registry's uniform 401. No checkout: the probe needs only the
    # run's OIDC identity.
    if: github.event_name == 'workflow_dispatch' && inputs.exchange-check
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Exchange and immediately revoke a trusted-publishing token
        # Explicit bash for pipefail, so a failed fetch cannot feed an
        # empty value downstream; `jq -e` fails on a missing field for
        # the same reason. The DELETE fails the job on an HTTP error:
        # unlike the publish path's best-effort revocation, proving
        # revocation works is half of what this probe is for.
        shell: bash
        run: |
          jwt="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cabinpkg.com" | jq -er .value)"
          echo "::add-mask::$jwt"
          token="$(curl -sSf -X PUT https://cabinpkg.com/api/v1/trusted_publishing/tokens -H "Content-Type: application/json" -d "{\"jwt\":\"$jwt\"}" | jq -er .token)"
          echo "::add-mask::$token"
          curl -sSf -o /dev/null -X DELETE https://cabinpkg.com/api/v1/trusted_publishing/tokens -H "Authorization: Bearer $token"
